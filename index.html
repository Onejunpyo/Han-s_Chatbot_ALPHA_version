  const r_ = (k, ...a) => { const v = R[settings.lang][k]; return typeof v === "function" ? v(...a) : v; };

  // 첨부 파일 안내 (기본 모드)
  function fileReport(files, bot) {
    const parts = [r_("fileSum", files)];
    const ds = files.find(f => f.dataset);
    if (ds) parts.push(r_("fileData", ds.dataset));
    const readable = files.filter(f => f.kind !== "image" && !f.scanned && (f.text || "").trim());
    readable.slice(0, 3).forEach(f => {
      const spec = fileCardSpec(f);
      bot.addCard(spec);
      if (!spec.table) parts.push(r_("fileOverview", f.name, spec));
    });
    if (files.some(f => f.kind === "image")) parts.push(r_("fileImage"));
    if (files.some(f => f.scanned)) parts.push(r_("fileScanned"));
    if (readable.some(f => !tableStats(f))) parts.push(r_("fileAsk"));
    else if (readable.length) parts.push(r_("fileAskTable"));
    return parts.join("\n\n");
  }
  const FILE_REF = /파일|문서|자료|보고서|논문|본문|첨부|pdf|워드|엑셀|\bfiles?\b|\bdocument|\breport\b|\bpaper\b|\bsheet\b|\btable\b|attachment/i;
  const ASK = /[?？]|뭐|무엇|무슨|어떻게|어떤|왜|언제|어디|누가|누구|몇|얼마|알려|설명|요약|정리|핵심|분석|찾아|나와|인가|일까|이란|란\s|뜻|\bwhat\b|\bhow\b|\bwhy\b|\bwhen\b|\bwhere\b|\bwho\b|\bwhich\b|\bexplain|\bsummar|\banaly|\btell\s+me|\bfind\b|\bdoes\b|\bis\s+there|\bmention/i;
  function wantsFileAnswer(tx) {
    if (parseXY(tx) || parseNNData(tx)) return false;
    if (/학습\s*(해|시켜)|\btrain\b/i.test(tx)) return false;
    if (/넣으면|what\s+about|when\s+x|if\s+x|x\s*=|일\s*때/i.test(tx) && nums(tx).length) return false;
    const explain = /뭐야|무엇|이란|란\s|뜻|what\s+is|what's|meaning|explain|설명/i.test(tx);
    if ((detectModel(tx) || /회귀|regression|예측|predict/i.test(tx)) && /해\s*줘|찾아\s*줘|그려|돌려|\b(do|run|fit|use|try|find|predict)\b/i.test(tx) && !explain) return false;
    return FILE_REF.test(tx) || ASK.test(tx);
  }
  // 기본 모드에서 파일에 대한 질문에 답하기
  function fileAnswer(c, tx, cx, cfiles) {
    const low = tx.toLowerCase();
    const named = cfiles.filter(f => { const n = f.name.toLowerCase(), base = n.replace(/\.[^.]+$/, ""); return low.includes(n) || (base.length >= 3 && low.includes(base)); });
    const targets = named.length ? named : cfiles;
    if (/평균|최대|최소|최댓값|최솟값|합계|총합|표준\s*편차|상관|통계|average|mean|max|min|sum|total|std|deviation|correlat|statistic/i.test(tx)) {
      const tf = targets.find(f => tableStats(f));
      if (tf) {
        const spec = fileCardSpec(tf), st = spec.table;
        const pick = st.cols.filter(col => low.includes(col.name.toLowerCase()));
        cx.bot.addCard(spec);
        return r_("statAns", tf.name, pick.length ? pick : st.cols, pick.length === 1 ? null : st.corr);
      }
    }
    if (/요약|정리|핵심|요점|개요|분석|무슨\s*내용|어떤\s*내용|summar|overview|main\s+points|gist|analy|about\s+(this|it)\b/i.test(tx)) {
      const out = targets.slice(0, 3).map(f => { const spec = fileCardSpec(f); cx.bot.addCard(spec); return r_("sumAns", f.name, spec); });
      return out.join("\n\n") + (useAI() ? "" : "\n\n" + r_("qaAIHint"));
    }
    const hits = searchFiles(targets, tx, 4);
    if (!hits.length) return canWeb() ? null : r_("qaNone", fileCardSpec(targets[0]).keywords);
    const best = highlight(snippet(hits[0].text, tx, 400), tx);
    const more = hits.slice(1).filter(h => h.score >= hits[0].score * 0.35).map(h => ({ snip: highlight(snippet(h.text, tx), tx), src: srcLabel(h) }));
    return r_("qaAnswer", best, srcLabel(hits[0]), more) + (useAI() ? "" : "\n\n" + r_("qaAIHint"));
  }

  async function ruleTurn(c, raw, bot, files = []) {
    const tx = raw.trim();
    const say = s => bot.addText(s);
    const cx = { conv: c, bot };
    const name = memoryName();
    let m;

    /* --- 첨부 파일 · Attachments --- */
    const isDefault = tx === I18N.ko.filesDefault || tx === I18N.en.filesDefault;
    const cfiles = (c.ctx.files || []).filter(f => f.kind !== "image" && (f.text || "").trim());
    const askFile = cfiles.length && !isDefault && wantsFileAnswer(tx);
    if (files.length) {
      say(askFile ? r_("fileSum", files) : fileReport(files, bot));
      if (isDefault) return;
    }

    /* --- 기억 · Memory --- */
    m = tx.match(/(?:내|제)\s*이름은\s*['"]?([^\s'",.!?]+?)(?:입니다|이에요|예요|이야|야|이다|라고\s*해)?[\s,.!?]*$/) || tx.match(/(?:my\s+name\s+is|call\s+me|i'?m\s+called)\s+['"]?([A-Za-z가-힣][\w가-힣'-]*)['"]?[\s,.!?]*$/i);
    if (m) {
      memory = memory.filter(x => !/이름(?:은|이)|name\s+is/i.test(x.text));
      toolRemember(r_("nameFact", m[1]));
      return say(r_("nameSaved", m[1]));
    }
    if (/(뭘|무엇을|뭐|어떤\s*걸)\s*기억|기억(하고\s*있는|한)\s*(것|내용|거)|what\s+do\s+you\s+remember|what\s+have\s+you\s+remembered|show\s+(me\s+)?(your\s+|my\s+)?memor/i.test(tx)) {
      return say(memory.length ? r_("memList", memory.map(x => x.text)) : r_("memNone"));
    }
    m = tx.match(/^(?:이걸\s*|이것을\s*|다음을\s*)?(?:기억해\s*(?:줘|주세요|둬)?|기억할\s*것)\s*[:：]?\s*(.+)$/) || tx.match(/^(.+?)\s*(?:라고|이라고|을|를)?\s*기억해\s*(?:줘|주세요|둬)?[.!]?$/) || tx.match(/^(?:please\s+)?remember(?:\s+that)?\s*[:：]?\s*(.+)$/i);
    if (m && m[1] && !/뭐|무엇|어떤/.test(m[1])) { toolRemember(m[1].trim()); return say(r_("remembered", m[1].trim())); }
    if (/잊어|기억.*지워|^forget\b|\bforget\s+(about|that|everything|all)/i.test(tx)) {
      const kw = tx.replace(/기억(에서|한\s*것|한\s*내용)?(을|를)?|(은|는|을|를)?\s*(잊어|지워)\s*(줘|주세요|버려)?|^forget\s*(about|that)?|please|[.!?]/gi, " ").replace(/\s+/g, " ").trim();
      if (/^(전부|모두|다|싹\s*다|모든\s*것|everything|all)?$/i.test(kw)) { memory = []; renderMemory(); saveAll(); return say(r_("forgotAll")); }
      const res = toolForget(kw);
      return say(res.removed ? r_("forgotN", res.removed) : r_("forgotNone"));
    }
    if (/지난\s*(번|대화)|전에\s*(했던|한|나눈)|이전\s*대화|예전\s*대화|last\s+time|previous\s+(chat|conversation)s?|earlier\s+(chat|conversation)s?|what\s+did\s+we\s+(do|talk)/i.test(tx)) {
      const q = tx.replace(/지난\s*(번|대화)(에)?|전에\s*(했던|한|나눈)|이전\s*대화|예전\s*대화|뭐\s*했|찾아\s*줘|보여\s*줘|알려\s*줘|last\s+time|previous|earlier|chats?|conversations?|what\s+did\s+we\s+(do|talk\s+about)|about|[?？]/gi, " ").trim();
      const res = toolSearchPast(q, cx);
      return say(res.conversations.length ? r_("pastList", res.conversations) : r_("pastNone"));
    }

    /* --- 인사 · 도움말 / Greeting · help --- */
    if (/^(안녕|하이|반가|hello|hi\b|hey\b|good\s+(morning|afternoon|evening))/i.test(tx) && tx.length < 24) return say(r_("greet", name));
    if (/도움말|사용법|뭘\s*할\s*수|무엇을\s*할\s*수|어떻게\s*써|기능|\bhelp\b|what\s+can\s+you\s+do|how\s+(do\s+i|to)\s+use/i.test(tx)) return say(r_("help"));

    /* --- GitHub --- */
    const fileM = tx.match(/([\w\-./가-힣]+\.(?:csv|tsv|txt|md|json|html|js|py))/i);
    if (/깃허브|깃헙|github|저장소|\brepo(sitory)?\b/i.test(tx)) {
      if (!can("github")) return say(r_("needSetup", "GitHub"));
      if (/저장|올려|커밋|업로드|기록|\bsave\b|\bcommit\b|\bupload\b|\bpush\b/i.test(tx)) {
        if (!c.ctx.report) return say(r_("noReport"));
        const stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, "");
        const path = fileM ? fileM[1] : `chatbot-results/${stamp}.md`;
        const res = await toolGithubWrite({ path, content: `${t("repDoc")}\n\n${c.ctx.report}\n\n${t("repSaved", new Date().toLocaleString(loc()))}\n`, commit_message: t("ghCommit", path) }, cx).catch(e => ({ error: e.message }));
        return say(res.cancelled ? r_("cancelled") : res.error ? r_("saveFail", res.error) : r_("ghSaved", res.path));
      }
      if (fileM) {
        const res = await toolGithubRead(fileM[1], cx).catch(e => ({ error: e.message }));
        if (res.error) return say(r_("readFail", res.error));
        if (res.numeric_columns && c.ctx.dataset) {
          const model = detectModel(tx);
          if (model || /회귀|분석|그래프|regress|analy|chart|plot|fit/i.test(tx)) return say(regSay(toolRegression({ model: model || "all", degree: detectDegree(tx) }, cx)));
          return say(r_("csvLoaded", res.path, Object.keys(res.numeric_columns)));
        }
        return say(r_("fileShown", res.path, res.truncated, res.content.slice(0, 3000)));
      }
      const p = (tx.match(/([\w\-./]+)\s*폴더/) || tx.match(/(?:folder|directory)\s+([\w\-./]+)/i) || [])[1] || "";
      const res = await toolGithubList(p, cx).catch(e => ({ error: e.message }));
      return say(res.error ? r_("listFail", res.error) : r_("listed", res.repo, p, res.items.length));
    }

    /* --- Notion --- */
    if (/노션|notion/i.test(tx)) {
      if (!can("notion")) return say(r_("needSetup", "Notion"));
      const urlM = tx.match(/https?:\/\/\S*notion\S*|[0-9a-f]{32}/i);
      if (/저장|만들|기록|올려|정리해|\bsave\b|\bcreate\b|\bwrite\b|\bexport\b|\badd\b/i.test(tx)) {
        const content = c.ctx.report || transcript(c);
        const title = t("notionTitle", new Date().toLocaleDateString(loc()), c.title);
        const res = urlM ? await toolNotionAppend({ page: urlM[0], content }, cx).catch(e => ({ error: e.message }))
                         : await toolNotionCreate({ title, content }, cx).catch(e => ({ error: e.message }));
        return say(res.cancelled ? r_("cancelled") : res.error ? r_("notionSaveFail", res.error) : r_("notionSaved", !!urlM, title));
      }
      const clean = s => s.replace(/(노션|notion)(에서|의)?|페이지(를|의)?|읽어\s*(줘|주세요)?|열어\s*(줘|주세요)?|내용(을)?|보여\s*(줘|주세요)?|검색\s*(해)?\s*(줘|주세요)?|찾아\s*(줘|주세요)?|목록|좀|\b(search|find|look\s+for|read|open|show|me|the|a|in|on|from|for|page|pages|please|content|of)\b|[?？.!]/gi, " ").replace(/\s+/g, " ").trim();
      if (urlM || /읽어|열어|내용|\bread\b|\bopen\b|\bcontents?\b/i.test(tx)) {
        let page = urlM && urlM[0];
        if (!page) {
          const q = clean(tx);
          const s = await toolNotionSearch(q, cx).catch(e => ({ error: e.message }));
          if (s.error) return say(r_("notionSearchFail", s.error));
          if (!s.results.length) return say(r_("notionNotFound", q));
          page = s.results[0].id;
        }
        const res = await toolNotionRead(page, cx).catch(e => ({ error: e.message }));
        if (res.error) return say(r_("notionReadFail", res.error));
        return say(r_("notionRead", res.title, res.truncated, res.text.split("\n").filter(Boolean)));
      }
      const res = await toolNotionSearch(clean(tx), cx).catch(e => ({ error: e.message }));
      return say(res.error ? r_("notionSearchFail", res.error) : res.results.length ? r_("notionFound", res.results.length) : r_("notionNone"));
    }

    /* --- 파일에 대한 질문 · Questions about files --- */
    const explicitWeb = /인터넷|웹\s*(에서|검색)|구글|네이버|온라인|검색\s*해|\bsearch\b|\blook\s*up\b|\bgoogle\b|\bonline\b|\bweb\b|\binternet\b/i.test(tx) && !/파일|문서|자료|첨부|\bfiles?\b|\bdocument/i.test(tx);
    if (explicitWeb) return say(await webAnswer(searchQuery(tx), bot));
    if (askFile) {
      const ans = fileAnswer(c, tx, cx, cfiles);
      if (ans) return say(ans);
      return say(r_("webFromFile") + "\n\n" + await webAnswer(searchQuery(tx), bot));
    }

    /* --- 인공신경망 · Neural network --- */
    const preset = (PRESET_TESTS.find(([, test]) => test(tx)) || [])[0];
    const nnWanted = /신경망|뉴럴|퍼셉트론|딥러닝|학습\s*(해|시켜)|neural|perceptron|deep\s*learning|\btrain(ing)?\b|xor/i.test(tx);
    const nnData = parseNNData(tx);
    if (nnWanted || (nnData && /학습|신경망|train|neural/i.test(tx))) {
      const opt = {};
      let mm;
      if ((mm = tx.match(/은닉\s*층?\s*(?:을|를|은)?\s*(\d+)/) || tx.match(/(\d+)\s*hidden\s*layers?/i) || tx.match(/hidden\s*layers?\s*(?:=|:|of)?\s*(\d+)/i))) opt.hidden_layers = +mm[1];
      if (/은닉\s*층?\s*(?:없이|없는)|은닉층\s*0|no\s+hidden|without\s+(a\s+|any\s+)?hidden|zero\s+hidden/i.test(tx)) opt.hidden_layers = 0;
      if ((mm = tx.match(/뉴런\s*(?:을|를|은)?\s*(\d+)|(\d+)\s*개의?\s*뉴런|(\d+)\s*neurons?|neurons?\s*(?:=|:)?\s*(\d+)/i))) opt.neurons = +(mm[1] || mm[2] || mm[3] || mm[4]);
      if ((mm = tx.match(/학습률\s*(?:을|를|은)?\s*(\d*\.?\d+)|learning\s*rate\s*(?:=|:|of)?\s*(\d*\.?\d+)|\blr\s*=?\s*(\d*\.?\d+)/i))) opt.learning_rate = +(mm[1] || mm[2] || mm[3]);
      if ((mm = tx.match(/([\d,]+)\s*(?:번|회|에포크|epochs?|iterations?|times)/i) || tx.match(/epochs?\s*(?:=|:)?\s*([\d,]+)/i))) opt.epochs = +mm[1].replace(/,/g, "");
      if (/시그모이드|sigmoid/i.test(tx)) opt.activation = "sigmoid"; else if (/relu|렐루/i.test(tx)) opt.activation = "relu"; else if (/tanh/i.test(tx)) opt.activation = "tanh";
      const args = Object.assign(opt, nnData || (preset ? { preset } : {}));
      if (!nnData && !preset && !c.ctx.nnData) return say(r_("nnAsk"));
      say(r_("training"));
      await sleep(30);
      const o = toolTrainNN(args, cx);
      bot.popText();
      if (o.error) return say(r_("nnFail", o.error));
      let s = r_("nnDone", o);
      if (o.diverged) s += "\n\n" + r_("nnDiverged");
      else if (o.correct < o.total && o.preset === "xor" && o.hidden_layers === 0) s += "\n\n" + r_("nnXor");
      else if (o.correct < o.total) s += "\n\n" + r_("nnNotAll");
      else s += "\n\n" + r_("nnTry", o.results[0].input.map(v => fmt(v)).join(" "));
      return say(s);
    }

    /* --- 예측 · Prediction --- */
    const predictWords = /예측|일\s*때|넣으면|이라면|이면\s*(얼마|몇)|넣어\s*(봐|줘)|얼마야|몇이야|\bpredict|\bforecast|\bwhen\s+x\b|\bif\s+x\b|\bat\s+x\s*=|\bfor\s+x\s*=|\bwhat\s+(about|if)\b|\bwhat\s+would\b|\bestimate\b/i;
    if (predictWords.test(tx) && !parseXY(tx) && !nnData) {
      const ns = nums(stripOptions(tx));
      if (c.ctx.last && c.ctx.last.kind === "nn" && c.ctx.nn && ns.length) {
        const k = c.ctx.nn.sizes[0];
        if (ns.length % k) return say(r_("nnCount", k));
        const inputs = []; for (let i = 0; i < ns.length; i += k) inputs.push(ns.slice(i, i + k));
        const o = toolPredictNN({ inputs }, cx);
        return say(o.error || r_("nnPred", o.predictions, c.ctx.nn.binaryOut));
      }
      if (c.ctx.dataset && ns.length) {
        const last = c.ctx.last && c.ctx.last.kind === "reg" ? c.ctx.last : { model: "all", degree: 2 };
        const o = toolRegression({ model: detectModel(tx) || last.model, degree: detectDegree(tx) || last.degree, predict_x: ns }, cx);
        if (o.error) return say(o.error);
        const xs = c.ctx.dataset.x;
        return say(r_("regPred", o, ns.some(v => v < Math.min(...xs) || v > Math.max(...xs))));
      }
    }

    /* --- 회귀 · Regression --- */
    const xy = parseXY(tx);
    const model = detectModel(tx);
    if (xy || (model && /회귀|분석|모델|선|식|해\s*줘|그려|맞|regress|fit|model|analy|line|curve|\bdo\b|\brun\b|\btry\b|\buse\b|\bswitch\b/i.test(tx)) || /회귀|regression/i.test(tx)) {
      if (!xy && !c.ctx.dataset) return say(r_("regAsk"));
      const px = (tx.match(/(?:예측|일\s*때)[^0-9-]*([-\d.,\s]*\d)/) || tx.match(/x\s*=\s*(-?\d+(?:\.\d+)?)\s*(?:일\s*때|에서)?\s*(?:을|를|의)?\s*(?:값\s*)?예측/i) || tx.match(/(?:predict(?:ion)?(?:\s+(?:at|for|when))?|when\s+x\s*(?:is|=)|at\s+x\s*=|for\s+x\s*=)\s*([-\d.,\s]*\d)/i) || [])[1];
      const o = toolRegression(Object.assign({ model: model || "all", degree: detectDegree(tx), predict_x: px ? nums(px) : [] }, xy || {}), cx);
      return say(regSay(o));
    }
    if (nnData) return say(r_("nnGot"));

    /* --- 이해하지 못한 경우 · Fallback --- */
    if (files.length) return say(r_("fileNoIntent"));
    if (canWeb() && tx.length >= 2) return say(await webAnswer(searchQuery(tx), bot));
    return say(`${r_("notUnderstood", useAI())}\n\n${r_("help")}`);
  }
  async function webAnswer(q, bot) {
    bot.addToolChip("web_search");
    let r;
    try { r = await webSearch(q); } catch (e) { return r_("webFail", e.message); }
    const shown = words(q).filter(w => !/^\d+$/.test(w)).join(" ") || q;
    bot.addCard({ type: "web", query: shown, provider: r.provider, sources: (r.sources || []).slice(0, 6) });
    if (!r.sources.length && !r.answer) return r_("webNone", shown);
    if (r.provider !== "openai" && !r.sources.length) return r_("webNone", q);
    if (isWebProv(r.provider)) {
      const ex = webExtract(r, q);
      const best = r.answer ? plainMd(r.answer) : ex.length ? highlight(snippet(ex[0].text, q, 350), q) : "";
      const src = !r.answer && ex.length ? `[${plainMd(ex[0].title)}](${safeUrl(ex[0].url)})` : "";
      const list = r.sources.slice(0, 5).map(x => `- [${plainMd(x.title || hostOf(x.url))}](${safeUrl(x.url)})${x.snippet ? " — " + plainMd(x.snippet).slice(0, 110) + (x.snippet.length > 110 ? "…" : "") : ""}`).join("\n");
      return r_("webAnsWeb", best, src, list) + (useAI() ? "" : "\n\n" + r_("webAIHint"));
    }
    return r_("webAns", r, q) + (r.provider === "openai" ? "" : "\n\n" + r_("webWikiHint"));
  }
  function regSay(o) {
    if (o.error) return o.error;
    let s = o.comparison ? r_("regAll", o) : r_("regOne", o);
    if (o.predictions) s += "\n\n" + o.predictions.map(p => r_("regPredLine", p)).join("\n");
    return s + "\n\n" + r_("regNext");
  }
  function transcript(c) {
    return `${t("repTranscript", c.title)}\n\n` + c.messages.slice(-12).map(m => `**${m.role === "user" ? t("me") : t("bot")}**: ${m.blocks.filter(b => b.t === "text").map(b => b.v).join(" ").slice(0, 600)}`).join("\n\n");
  }

     12. 화면 그리기

    $(".hello h1", thread).textContent = t("hello", memoryName());
    $(".hello h2", thread).textContent = t("helloSub");
    const icons = [ICON.chart, ICON.brain, ICON.folder, ICON.page];
    const box = $(".chips", thread);
    t("chips").forEach(([prompt, label], i) => {
      const b = document.createElement("button");
      b.className = "chip"; b.innerHTML = `${esc(label)}<span class="ci">${icons[i]}</span>`;
      b.addEventListener("click", () => send(prompt));
      box.appendChild(b);
    });
  }

  function msgEl(msg) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + msg.role;
    if (msg.role === "user") {
      const col = document.createElement("div");
      col.className = "ucol";
      const fb = msg.blocks.find(b => b.t === "files");
      if (fb) col.appendChild(fileChipsEl(fb.v));
      const text = msg.blocks.filter(b => b.t === "text").map(b => b.v).join("\n");
      if (text) { const bub = document.createElement("div"); bub.className = "bubble"; bub.textContent = text; col.appendChild(bub); }
      wrap.appendChild(col);
      return wrap;
    }
    wrap.innerHTML = `<div class="avatar">${ICON.spark}</div><div class="content"></div>`;
    const content = $(".content", wrap);
    msg.blocks.forEach(b => content.appendChild(blockEl(b)));
    if (msg.blocks.some(b => b.t === "text")) content.appendChild(actionsEl(msg));
    return wrap;
  }
  function blockEl(b) {
    if (b.t === "card") return renderCard(b.v);
    if (b.t === "tool") { const s = document.createElement("div"); s.innerHTML = `<span class="tool-chip">⚙️ ${esc(t("tools")[b.v] || b.v)}</span>`; return s; }
    const d = document.createElement("div"); d.className = "md" + (b.err ? " err" : ""); d.innerHTML = md(b.v); return d;
  }
  function actionsEl(msg) {
    const a = document.createElement("div");
    a.className = "actions";
    a.innerHTML = `<button aria-label="${esc(t("copy"))}" title="${esc(t("copy"))}">${ICON.copy}</button>`;
    a.querySelector("button").addEventListener("click", async e => {
      const btn = e.currentTarget;
      try { await navigator.clipboard.writeText(msg.blocks.filter(b => b.t === "text").map(b => b.v).join("\n\n")); btn.title = t("copied"); } catch (err) { /* 클립보드 권한 없음 */ }
    });
    return a;
  }
  function renderChat() {
    const c = current();
    if (!c || !c.messages.length) return renderEmpty();
    thread.innerHTML = "";
    c.messages.forEach(m => thread.appendChild(msgEl(m)));
    requestAnimationFrame(scrollDown);
  }
  function renderAll() { renderSidebar(); renderChat(); renderStatus(); }

  function renderStatus() {
    const g = can("openai"), n = can("notion"), h = can("github");
    $("#dotG").classList.toggle("on", g); $("#dotN").classList.toggle("on", n); $("#dotH").classList.toggle("on", h);
    const pill = $("#modePill");
    pill.textContent = useAI() ? t("modeAI") : t("modeBasic");
    pill.title = t("pillTitle", g, n, h);
    const st = $("#sStatus");
    if (!workerUrl()) { st.innerHTML = `<span>⚪</span><span class="note">${esc(t("stNoWorker"))}</span>`; return; }
    if (!health) { st.innerHTML = `<span>⏳</span><span class="note">${esc(t("stChecking"))}</span>`; return; }
    if (health.error) { st.innerHTML = `<span>⚠️</span><span class="err">${esc(health.error)}</span>`; return; }
    if (!health.authorized) { st.innerHTML = `<span>🔒</span><span class="err">${esc(t("stCodeBad"))}</span>`; return; }
    const row = (ok, label, extra) => `<span>${ok ? "✅" : "⚪"}</span><span>${label} ${esc(ok ? t("stOn") : t("stOff"))}${extra ? ` <span class="note">${esc(extra)}</span>` : ""}</span>`;
    st.innerHTML = row(health.openai, "OpenAI", health.model) + row(health.notion, "Notion", health.notion && !health.notionParent ? t("stNoParent") : "") + row(health.github, "GitHub", health.repo)
      + `<span>${canWeb() ? "✅" : "⚪"}</span><span>${esc(t("stWeb"))}: ${esc(!canWeb() ? t("stOff") : can("search") ? t("provOpenAI") : can("web") ? t("provWeb", health.webProvider || "DuckDuckGo") : t("provWiki"))}</span>`;
  }

  /* 응답 중인 챗봇 메시지를 다루는 도우미 */
  function startBot(c) {
    const msg = { role: "bot", blocks: [], ts: Date.now() };
    const wrap = document.createElement("div");
    wrap.className = "msg bot";
    wrap.innerHTML = `<div class="avatar thinking">${ICON.spark}</div><div class="content"><div class="typing"><i></i><i></i><i></i></div></div>`;
    thread.appendChild(wrap);
    const content = $(".content", wrap), typing = $(".typing", wrap);
    const put = (b, el) => { msg.blocks.push(b); content.insertBefore(el, typing); scrollDown(); return el; };
    return {
      msg,
      addText(v, err) { const b = { t: "text", v: String(v), err: !!err }; put(b, blockEl(b)); },
      popText() { const i = msg.blocks.map(b => b.t).lastIndexOf("text"); if (i >= 0) { msg.blocks.splice(i, 1); const els = content.querySelectorAll(".md"); if (els.length) els[els.length - 1].remove(); } },
      addCard(spec) { const b = { t: "card", v: spec }; put(b, blockEl(b)); },
      addToolChip(name) { if (name === "remember" || name === "forget") return; const b = { t: "tool", v: name }; put(b, blockEl(b)); },
      confirm(html) {
        return new Promise(resolve => {
          const box = document.createElement("div");
          box.className = "confirm";
          box.innerHTML = `<div>${html}</div><div class="btns"><button class="btn primary"></button><button class="btn"></button></div>`;
          const [yes, no] = box.querySelectorAll("button");
          yes.textContent = t("allow"); no.textContent = t("cancel");
          content.insertBefore(box, typing); scrollDown();
          const done = ok => { box.remove(); resolve(ok); };
          yes.addEventListener("click", () => done(true)); no.addEventListener("click", () => done(false));
          yes.focus();
        });
      },
      done() {
        typing.remove(); $(".avatar", wrap).classList.remove("thinking");
        if (!msg.blocks.length) this.addText(t("emptyAnswer"));
        if (msg.blocks.some(b => b.t === "text")) content.appendChild(actionsEl(msg));
        c.messages.push(msg);
      }
    };
  }

  /* =================================================================
     13. 메시지 보내기
     ================================================================= */
  async function send(text) {
    text = String(text || "").trim();
    if (busy || pending.some(p => p.status === "loading")) return;
    const files = pending.filter(p => p.status === "ok").map(p => p.data);
    if (!text && !files.length) return;
    if (!text) text = t("filesDefault");
    busy = true; $("#send").disabled = true;
    let c = current();
    if (!c) c = newConv();
    if (!Array.isArray(c.llm)) c.llm = [];
    if (!c.messages.length) { const ttl = text === t("filesDefault") && files.length ? files[0].name : text; c.title = ttl.replace(/\s+/g, " ").slice(0, 28) + (ttl.length > 28 ? "…" : ""); thread.innerHTML = ""; }
    const um = { role: "user", blocks: [{ t: "text", v: text }], ts: Date.now() };
    if (files.length) um.blocks.unshift({ t: "files", v: files.map(f => ({ name: f.name, kind: f.kind, size: f.size, pages: f.pages, length: f.length, scanned: f.scanned })) });
    c.messages.push(um);
    if (files.length) keepFiles(c, files);
    thread.appendChild(msgEl(um));
    pending = []; renderPending();
    $("#input").value = ""; autosize();
    renderSidebar();
    const bot = startBot(c);
    scrollDown();
    try {
      if (useAI()) {
        try { await aiTurn(c, text, files, bot); }
        catch (e) {
          bot.addText(t("aiFallback", e.message), true);
          await ruleTurn(c, text, bot, files);
        }
      } else await ruleTurn(c, text, bot, files);
    } catch (e) {
      bot.addText(t("procError", e.message), true);
    }
    bot.done();
    c.updated = Date.now();
    saveAll(); renderSidebar();
    busy = false; updateSend();
    $("#input").focus();
  }

  /* =================================================================
     14. GitHub 동기화 (선택 기능)
     ================================================================= */
  let syncTimer = null;
  function scheduleSync() {
    if (!settings.sync || !can("github")) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushSync, 15000);
  }
  async function pushSync() {
    const data = { version: 2, updated: Date.now(), memory, conversations: convs.filter(c => c.messages.length).slice(0, 50).map(c => { const s = storable(c); return Object.assign({}, s, { llm: (s.llm || []).slice(-30) }); }) };
    try { await api("/github/write", { path: SYNC_PATH, content: JSON.stringify(data), message: t("syncCommit") }); $("#sSyncMsg").textContent = t("syncSaved", new Date().toLocaleTimeString(loc())); }
    catch (e) { $("#sSyncMsg").textContent = t("syncFail", e.message); }
  }
  async function pullSync() {
    try {
      const r = await api("/github/read", { path: SYNC_PATH });
      const data = JSON.parse(r.content);
      (data.memory || []).forEach(m => { if (!memory.some(x => x.text === m.text)) memory.push(m); });
      (data.conversations || []).forEach(rc => {
        rc.llm = Array.isArray(rc.llm) ? rc.llm : []; delete rc.gem;
        const i = convs.findIndex(x => x.id === rc.id);
        if (i < 0) convs.push(rc); else if (rc.updated > convs[i].updated) convs[i] = rc;
      });
      store.set("dh.convs", convs.map(storable)); store.set("dh.memory", memory);
      renderAll(); renderMemory();
      $("#sSyncMsg").textContent = t("syncLoaded", (data.conversations || []).length, (data.memory || []).length);
    } catch (e) { $("#sSyncMsg").textContent = e.status === 404 ? t("syncNone") : t("syncLoadFail", e.message); }
  }

  /* =================================================================
     15. 설정 창 · 입력창 · 파일 첨부 · 음성 입력 · 언어
     ================================================================= */
  function renderMemory() {
    const ul = $("#memList");
    ul.innerHTML = memory.length ? "" : `<li><span class="note">${esc(t("sMemNone"))}</span></li>`;
    memory.forEach(m => {
      const li = document.createElement("li");
      li.innerHTML = `<span></span><button aria-label="${esc(t("sMemDel"))}" title="${esc(t("sMemDel"))}">${ICON.trash}</button>`;
      li.firstChild.textContent = m.text;
      li.querySelector("button").addEventListener("click", () => { memory = memory.filter(x => x.id !== m.id); saveAll(); renderMemory(); if (!current() || !current().messages.length) renderEmpty(); });
      ul.appendChild(li);
    });
  }
  const dlg = $("#settings");
  function openSettings() {
    $("#sUrl").value = settings.workerUrl || CONFIG.WORKER_URL || "";
    $("#sCode").value = settings.code || "";
    dlg.querySelectorAll('input[name="mode"]').forEach(r => { r.checked = r.value === settings.mode; });
    $("#sSync").checked = !!settings.sync;
    $("#sWeb").checked = settings.web !== false;
    applyStatic(); renderMemory(); renderStatus();
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
  }
  $("#openSettings").addEventListener("click", openSettings);
  $("#modePill").addEventListener("click", openSettings);
  $("#sClose").addEventListener("click", () => dlg.close());
  dlg.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
  $("#langBtn").addEventListener("click", () => setLang(settings.lang === "ko" ? "en" : "ko"));
  $("#sTest").addEventListener("click", async () => {
    settings.workerUrl = $("#sUrl").value.trim(); settings.code = $("#sCode").value; saveSettings();
    $("#sTestMsg").textContent = t("stTesting"); health = null; renderStatus();
    await checkHealth();
    $("#sTestMsg").textContent = health && !health.error && health.authorized ? t("stTestOk") : "";
    if (settings.sync && can("github")) pullSync();
  });
  dlg.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener("change", () => { settings.mode = r.value; saveSettings(); renderStatus(); }));
  $("#sWeb").addEventListener("change", e => { settings.web = e.target.checked; saveSettings(); renderStatus(); });
  // 인터넷 검색이 어느 단계에서 막히는지 하나씩 확인합니다
  $("#sWebTest").addEventListener("click", async () => {
    const out = $("#sWebMsg"), q = isKo() ? "부력" : "buoyancy", rows = [];
    out.textContent = t("stTesting");
    rows.push(navigator.onLine === false ? "⚠️ " + t("webDevOffline") : "✅ " + t("webDevOnline"));
    const run = async (label, fn) => {
      try { const r = await fn(); const first = r.sources && r.sources[0]; rows.push(`✅ ${label}${first ? " — " + first.title : ""}`); }
      catch (e) { rows.push(`❌ ${label} — ${e.message}`); }
    };
    if (can("web")) await run(t("provWeb", health.webProvider || "DuckDuckGo"), () => api("/web", { query: q, lang: settings.lang }).then(r => { (r.warnings || []).forEach(x => rows.push("⚠️ " + x)); return { sources: r.results }; })); else rows.push(`⚪ ${t("provWeb", "DuckDuckGo")} — ${t("stOff")}`);
    await run(t("provWiki"), () => wikiDirect(q));
    if (can("wiki")) await run(t("provWikiRelay"), () => wikiViaWorker(q)); else rows.push(`⚪ ${t("provWikiRelay")} — ${t("stOff")}`);
    if (can("search")) await run(t("provOpenAI"), () => api("/search", { query: q, lang: settings.lang })); else rows.push(`⚪ ${t("provOpenAI")} — ${t("stOff")}`);
    out.innerHTML = rows.map(esc).join("<br>");
  });
  $("#sSync").addEventListener("change", e => { settings.sync = e.target.checked; saveSettings(); if (settings.sync) { if (!can("github")) $("#sSyncMsg").textContent = t("syncNeedGh"); else pullSync().then(scheduleSync); } });
  $("#sPull").addEventListener("click", () => { if (!can("github")) { $("#sSyncMsg").textContent = t("syncNeedConn"); return; } pullSync(); });
  $("#sClear").addEventListener("click", () => { if (confirm(t("cfClear"))) { convs = []; currentId = null; saveAll(); renderAll(); } });
  $("#sForgetAll").addEventListener("click", () => { if (confirm(t("cfForget"))) { memory = []; saveAll(); renderMemory(); } });
  $("#memAdd").addEventListener("click", () => { const v = $("#memNew").value.trim(); if (v) { toolRemember(v); $("#memNew").value = ""; } });

  const input = $("#input");
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; updateSend(); }
  function updateSend() {
    const loading = pending.some(p => p.status === "loading"), okFiles = pending.some(p => p.status === "ok");
    $("#send").disabled = busy || loading || (!input.value.trim() && !okFiles);
  }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); } });
  input.addEventListener("paste", e => { const fl = e.clipboardData && e.clipboardData.files; if (fl && fl.length) { e.preventDefault(); addFiles([...fl]); } });
  $("#composer").addEventListener("submit", e => { e.preventDefault(); send(input.value); });
  $("#newChat").addEventListener("click", () => { currentId = null; renderAll(); closeSide(); input.focus(); });

  // 파일 첨부: 버튼 · 끌어다 놓기
  const fileIn = $("#fileIn");
  $("#attach").addEventListener("click", () => fileIn.click());
  fileIn.addEventListener("change", () => { addFiles([...fileIn.files]); fileIn.value = ""; });
  const mainEl = $("#main"), drop = $("#drop");
  let dragDepth = 0;
  const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes("Files");
  mainEl.addEventListener("dragenter", e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; drop.classList.add("on"); });
  mainEl.addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
  mainEl.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.classList.remove("on"); });
  mainEl.addEventListener("drop", e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; drop.classList.remove("on"); addFiles([...e.dataTransfer.files]); });

  const side = $("#side"), scrim = $("#scrim");
  const mobile = () => window.matchMedia("(max-width: 800px)").matches;
  function closeSide() { side.classList.remove("open"); scrim.classList.remove("open"); }
  $("#toggleSide").addEventListener("click", () => { if (mobile()) closeSide(); else side.classList.toggle("collapsed"); });
  $("#menuMobile").addEventListener("click", () => { side.classList.add("open"); scrim.classList.add("open"); });
  scrim.addEventListener("click", closeSide);

  // 음성 입력 (선택한 언어로 인식)
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $("#mic");
  if (!SR) mic.style.display = "none";
  else {
    let rec = null;
    mic.addEventListener("click", () => {
      if (rec) { rec.stop(); return; }
      rec = new SR(); rec.lang = t("speech"); rec.interimResults = true; rec.continuous = false;
      let finalText = "";
      rec.onresult = e => {
        let interim = "";
        for (let i = e.resultIndex; i < e.results.length; i++) { const tr = e.results[i][0].transcript; if (e.results[i].isFinal) finalText += tr; else interim += tr; }
        input.value = finalText + interim; autosize();
      };
      rec.onend = () => { mic.classList.remove("on"); rec = null; if (finalText.trim()) send(finalText); };
      rec.onerror = () => { mic.classList.remove("on"); };
      mic.classList.add("on"); rec.start();
    });
  }

  /* =================================================================
     16. 시작
     ================================================================= */
  convs = convs.filter(c => c.messages.length);
  convs.forEach(c => { if (!Array.isArray(c.llm)) c.llm = []; delete c.gem; c.ctx = c.ctx || {}; });
  if (!current()) currentId = null;
  applyStatic();
  renderAll();
  input.focus();
  checkHealth().then(() => { if (settings.sync && can("github")) pullSync(); });
})();
</script>
</body>
</html>
