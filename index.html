<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데이터 도우미 · Data Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ========== 색상 ========== */
  :root {
    --bg: #FFFFFF; --side: #F0F4F9; --surface: #F0F4F9; --surface2: #E3E9F1; --text: #1F1F1F;
    --muted: #5E6470; --line: #DDE3EA; --accent: #0B57D0; --accent-soft: #D3E3FD; --user: #E9EEF6;
    --danger: #B3261E; --ok: #146C2E; --pt: #0B57D0; --curve: #D93025; --other: #8A97A3; --grid: #E6EBF1;
    color-scheme: light; box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131314; --side: #1E1F20; --surface: #1E1F20; --surface2: #2A2C2E; --text: #E3E3E3;
      --muted: #A8ABB1; --line: #3C4043; --accent: #A8C7FA; --accent-soft: #0B3B66; --user: #282A2C;
      --danger: #F2B8B5; --ok: #6DD58C; --pt: #A8C7FA; --curve: #F28B82; --other: #7D858D; --grid: #2B2E31;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131314; --side: #1E1F20; --surface: #1E1F20; --surface2: #2A2C2E; --text: #E3E3E3;
    --muted: #A8ABB1; --line: #3C4043; --accent: #A8C7FA; --accent-soft: #0B3B66; --user: #282A2C;
    --danger: #F2B8B5; --ok: #6DD58C; --pt: #A8C7FA; --curve: #F28B82; --other: #7D858D; --grid: #2B2E31;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; font-variant-numeric: tabular-nums;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ========== 전체 배치 ========== */
  .app { display: flex; height: 100dvh; overflow: hidden; }
  .side { width: 272px; flex: none; background: var(--side); display: flex; flex-direction: column; padding: 12px 10px; gap: 6px; transition: width .2s ease; }
  .side.collapsed { width: 68px; }
  .side.collapsed .label, .side.collapsed .history, .side.collapsed .side-title { display: none; }
  .icon-btn { border: none; background: none; width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: none; }
  .icon-btn:hover { background: var(--surface2); color: var(--text); }
  .side-btn { border: none; background: none; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 22px; color: var(--text); text-align: left; width: 100%; }
  .side-btn:hover { background: var(--surface2); }
  .side-btn.new { background: var(--surface2); width: fit-content; padding-right: 18px; margin: 6px 0 10px; }
  .side.collapsed .side-btn.new { padding-right: 12px; }
  .side-title { font-size: 13px; color: var(--muted); padding: 8px 12px 4px; font-weight: 500; }
  .history { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
  .conv { display: flex; align-items: center; border-radius: 18px; padding: 0 4px 0 12px; height: 38px; color: var(--text); cursor: pointer; font-size: 14px; }
  .conv:hover { background: var(--surface2); }
  .conv.active { background: var(--accent-soft); }
  .conv span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .conv button { opacity: 0; border: none; background: none; width: 30px; height: 30px; border-radius: 50%; color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .conv:hover button, .conv button:focus-visible { opacity: 1; }
  .conv button svg { width: 16px; height: 16px; }
  .side-foot { border-top: 1px solid var(--line); padding-top: 6px; }
  .dots { display: flex; gap: 6px; margin-left: auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--ok); }
  .side.collapsed .dots { display: none; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; height: 60px; }
  .brand { font-size: 20px; font-weight: 500; white-space: nowrap; }
  .mode-pill, .lang-btn { border: none; background: var(--surface); color: var(--muted); font-size: 13px; border-radius: 16px; padding: 4px 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .mode-pill:hover, .lang-btn:hover { background: var(--surface2); color: var(--text); }
  .lang-btn { margin-left: auto; padding: 6px 12px; }
  .lang-btn svg { width: 16px; height: 16px; }
  .menu-mobile { display: none; }

  .scroll { flex: 1; overflow-y: auto; }
  .thread { max-width: 780px; margin: 0 auto; padding: 8px 20px 24px; }

  /* 빈 화면 */
  .hello { padding: 9vh 0 24px; }
  .hello h1 { font-size: clamp(32px, 6vw, 52px); line-height: 1.2; font-weight: 500; margin: 0; letter-spacing: -0.02em; background: linear-gradient(90deg, #4285F4 0%, #9B72CB 45%, #D96570 85%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hello h2 { font-size: clamp(26px, 5vw, 44px); line-height: 1.25; font-weight: 500; margin: 4px 0 0; color: var(--muted); opacity: .55; letter-spacing: -0.02em; }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 40px; }
  .chip { border: none; background: var(--surface); border-radius: 14px; padding: 14px 14px 40px; text-align: left; font-size: 14px; line-height: 1.5; position: relative; min-height: 120px; color: var(--text); }
  .chip:hover { background: var(--surface2); }
  .chip .ci { position: absolute; right: 10px; bottom: 10px; width: 32px; height: 32px; border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .chip .ci svg { width: 17px; height: 17px; }

  /* 메시지 */
  .msg { display: flex; gap: 14px; margin: 22px 0; }
  .msg.user { justify-content: flex-end; }
  .ucol { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; max-width: 80%; min-width: 0; }
  .msg.user .bubble { background: var(--user); padding: 10px 18px; border-radius: 22px 6px 22px 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .avatar { width: 32px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .avatar svg { width: 26px; height: 26px; }
  .avatar.thinking svg { animation: spin 1.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .content { flex: 1; min-width: 0; padding-top: 4px; }
  .content > * + * { margin-top: 12px; }
  .md p { margin: 0 0 10px; }
  .md p:last-child { margin-bottom: 0; }
  .md h3, .md h4 { margin: 14px 0 6px; font-size: 16px; font-weight: 600; }
  .md ul, .md ol { margin: 4px 0 10px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md code { background: var(--surface); padding: 1px 6px; border-radius: 5px; font-size: 0.92em; font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
  .md pre { background: var(--surface); padding: 12px 14px; border-radius: 10px; overflow-x: auto; margin: 6px 0 10px; }
  .md pre code { background: none; padding: 0; font-size: 13px; }
  .md table { border-collapse: collapse; margin: 6px 0 10px; font-size: 14px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .md th { background: var(--surface); font-weight: 500; }
  .md blockquote { margin: 6px 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .md a { color: var(--accent); }
  .note { font-size: 13px; color: var(--muted); }
  .err { color: var(--danger); }
  .actions { display: flex; gap: 2px; margin-top: 6px; }
  .actions button { border: none; background: none; width: 34px; height: 34px; border-radius: 50%; color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .actions button:hover { background: var(--surface); }
  .actions svg { width: 17px; height: 17px; }
  .typing { display: flex; gap: 5px; padding: 10px 0; }
  .typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .35; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 50% { opacity: 1; } }
  .tool-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); background: var(--surface); border-radius: 14px; padding: 3px 10px; }

  /* 첨부 파일 */
  .fchips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .fchip { display: inline-flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px 6px 10px; font-size: 13px; max-width: 260px; }
  .fchip .fi { font-size: 18px; line-height: 1; }
  .fchip .fn { display: flex; flex-direction: column; min-width: 0; line-height: 1.35; }
  .fchip .fn b { font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .fchip .fn span { color: var(--muted); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .fchip.err { border-color: var(--danger); }
  .fchip.err .fn span { color: var(--danger); }
  .fchip button { border: none; background: none; width: 26px; height: 26px; border-radius: 50%; color: var(--muted); display: flex; align-items: center; justify-content: center; flex: none; }
  .fchip button:hover { background: var(--surface2); color: var(--text); }
  .fchip button svg { width: 15px; height: 15px; }
  .pending { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 4px 2px; }
  .pending:empty { display: none; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: -2px; }
  .drop { position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 24px; background: color-mix(in srgb, var(--bg) 85%, transparent); display: none; align-items: center; justify-content: center; font-size: 18px; color: var(--accent); z-index: 10; pointer-events: none; }
  .drop.on { display: flex; }

  /* 결과 카드 */
  .card { border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: var(--bg); }
  .card h4 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .card .sub { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  .card a { color: var(--accent); }
  .eq { font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif; font-style: italic; font-size: 20px; color: var(--curve); margin: 4px 0 8px; overflow-x: auto; white-space: nowrap; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); border-top: 1px solid var(--line); margin-top: 6px; }
  .stat { padding: 8px 10px 2px 0; }
  .stat .v { font-size: 18px; font-weight: 500; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .chart { width: 100%; overflow-x: auto; margin-top: 8px; }
  .chart svg { display: block; width: 100%; min-width: 360px; height: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .legend i { display: inline-block; width: 16px; border-top: 2.5px solid; vertical-align: middle; margin-right: 5px; }
  .legend b { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  .tbl { overflow-x: auto; margin-top: 10px; }
  .tbl table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .tbl th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl tr.best td { background: var(--surface); }
  .tbl .num { text-align: right; }
  .ok { color: var(--ok); font-weight: 500; } .ng { color: var(--danger); font-weight: 500; }
  .confirm { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--surface); }
  .confirm .btns { display: flex; gap: 8px; margin-top: 10px; }
  .btn { border: 1px solid var(--line); background: var(--bg); border-radius: 18px; padding: 6px 16px; font-size: 14px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn:disabled { opacity: .5; cursor: default; }
  .kw { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 6px; }
  .kw .k { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .tag { background: var(--surface); border-radius: 12px; padding: 2px 10px; font-size: 13px; }
  .filelist { list-style: none; padding: 0; margin: 0; font-size: 14px; }
  .filelist li { padding: 4px 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  .filelist li span:last-child { margin-left: auto; color: var(--muted); font-size: 12px; }

  /* 입력창 */
  .composer-wrap { padding: 0 20px 14px; }
  .composer { max-width: 780px; margin: 0 auto; background: var(--surface); border-radius: 28px; padding: 6px; }
  .crow { display: flex; align-items: flex-end; gap: 2px; }
  .composer textarea { flex: 1; min-width: 0; border: none; background: none; resize: none; font: inherit; color: var(--text); outline: none; padding: 12px 4px; max-height: 200px; line-height: 1.5; min-height: 48px; }
  .composer textarea::placeholder { color: var(--muted); }
  .composer .icon-btn { margin-bottom: 2px; }
  .send { color: var(--accent) !important; }
  .send:disabled { color: var(--muted) !important; opacity: .5; cursor: default; }
  .mic.on { background: var(--accent-soft); color: var(--accent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--accent-soft); } }
  .disclaimer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* 설정 */
  dialog { border: none; border-radius: 24px; padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); background: var(--bg); color: var(--text); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .dlg { padding: 22px 24px; overflow-y: auto; max-height: calc(100dvh - 48px); }
  .dlg h2 { margin: 0 0 4px; font-size: 20px; font-weight: 500; }
  .dlg h3 { margin: 22px 0 6px; font-size: 15px; font-weight: 600; }
  .dlg p { margin: 4px 0; }
  .field { display: block; margin: 8px 0; }
  .field span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .txt { width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1px solid transparent; border-radius: 12px; padding: 9px 12px; }
  .txt:focus { border-color: var(--accent); outline: none; }
  .radio { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; font-size: 14px; }
  .radio input { margin-top: 5px; }
  .seg { display: inline-flex; background: var(--surface); border-radius: 20px; padding: 3px; gap: 2px; }
  .seg button { border: none; background: none; border-radius: 16px; padding: 5px 16px; font-size: 14px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .status { font-size: 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin-top: 8px; }
  .memlist { list-style: none; padding: 0; margin: 6px 0; }
  .memlist li { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .memlist li span { flex: 1; }
  .memlist button { border: none; background: none; color: var(--muted); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .memlist button:hover { background: var(--surface); color: var(--danger); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .row .txt { flex: 1; min-width: 180px; width: auto; }
  .dlg-foot { display: flex; justify-content: flex-end; margin-top: 22px; }

  .scrim { display: none; }
  @media (max-width: 800px) {
    .side { position: fixed; inset: 0 auto 0 0; z-index: 20; width: 280px; transform: translateX(-100%); transition: transform .2s ease; box-shadow: 0 0 30px rgba(0,0,0,.2); }
    .side.collapsed { width: 280px; }
    .side.collapsed .label, .side.collapsed .side-title { display: revert; }
    .side.collapsed .history { display: block; }
    .side.collapsed .dots { display: flex; }
    .side.open { transform: none; }
    .scrim.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 15; }
    .menu-mobile { display: inline-flex; }
    .top { padding: 10px 10px; gap: 6px; }
    .brand { font-size: 18px; }
    .lang-btn .lang-label { display: none; }
    .thread { padding: 8px 16px 20px; }
    .composer-wrap { padding: 0 12px 10px; }
    .chips { grid-template-columns: 1fr 1fr; }
    .chip { min-height: 100px; }
    .msg { gap: 8px; }
    .ucol { max-width: 88%; }
    .composer .icon-btn { width: 40px; height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <!-- ===== 왼쪽 사이드바 ===== -->
  <aside class="side" id="side">
    <button class="icon-btn" id="toggleSide" data-i18n-aria="menu" data-i18n-title="menu">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="side-btn new" id="newChat" data-i18n-title="newChat">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="label" data-i18n="newChat"></span>
    </button>
    <div class="side-title" data-i18n="recent"></div>
    <nav class="history" id="history" data-i18n-aria="convList"></nav>
    <div class="side-foot">
      <button class="side-btn" id="openSettings" data-i18n-title="settingsBtn">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span class="label" data-i18n="settingsBtn"></span>
        <span class="dots" aria-hidden="true"><i class="dot" id="dotG" title="OpenAI"></i><i class="dot" id="dotN" title="Notion"></i><i class="dot" id="dotH" title="GitHub"></i></span>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ===== 가운데 대화 영역 ===== -->
  <main class="main" id="main">
    <div class="top">
      <button class="icon-btn menu-mobile" id="menuMobile" data-i18n-aria="openMenu">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="brand" data-i18n="appName"></span>
      <button class="mode-pill" id="modePill"></button>
      <button class="lang-btn" id="langBtn" title="언어 바꾸기 · Change language" aria-label="언어 바꾸기 · Change language">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
        <span class="lang-label" id="langLabel"></span>
      </button>
    </div>
    <div class="scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </div>
    <div class="composer-wrap">
      <form class="composer" id="composer">
        <div class="pending" id="pending"></div>

  /* =================================================================
     1. 저장된 상태 (대화 목록 · 기억 · 설정)
     ================================================================= */
  let convs = store.get("dh.convs", []);
  let memory = store.get("dh.memory", []);
  const guessLang = () => (/^ko/i.test(navigator.language || "") ? "ko" : "en");
  let settings = Object.assign({ workerUrl: "", code: "", mode: "auto", sync: false, web: true, lang: guessLang() }, store.get("dh.settings", {}));
  if (!I18N[settings.lang]) settings.lang = "ko";
  let currentId = store.get("dh.current", null);
  let health = null;
  let busy = false;
  let pending = [];   // 보내기 전에 첨부한 파일들

  const L = () => I18N[settings.lang];
  function t(key, ...args) {
    const v = L()[key] !== undefined ? L()[key] : I18N.ko[key];
    return typeof v === "function" ? v(...args) : v;
  }
  const loc = () => t("locale");
  const isKo = () => settings.lang === "ko";

  // 설정 창에 Cloudflare 관리 화면 주소(dash.cloudflare.com)를 잘못 넣었으면 무시하고 코드에 적힌 주소를 씁니다
  const workerUrl = () => { const u = (settings.workerUrl || "").trim(); return (u && !/dash\.cloudflare\.com/i.test(u) ? u : CONFIG.WORKER_URL || "").trim().replace(/\/+$/, ""); };
  const current = () => convs.find(c => c.id === currentId) || null;

  // 저장할 때는 이미지 데이터를 빼서 저장 공간을 아낍니다
  function storable(c) {
    if (!c.llm || !c.llm.some(m => Array.isArray(m.content))) return c;
    return Object.assign({}, c, { llm: c.llm.map(m => Array.isArray(m.content) ? Object.assign({}, m, { content: m.content.map(p => p.type === "image_url" ? { type: "text", text: t("omittedImage") } : p) }) : m) });
  }
  function saveAll() {
    convs.sort((a, b) => b.updated - a.updated);
    if (!store.set("dh.convs", convs.map(storable))) {
      // 저장 공간이 부족하면 오래된 대화의 파일 내용부터 줄입니다
      convs.slice(3).forEach(c => { (c.ctx.files || []).forEach(f => { f.text = f.text.slice(0, 4000); f.truncated = true; }); });
      store.set("dh.convs", convs.map(storable));
    }
    store.set("dh.memory", memory);
    store.set("dh.current", currentId);
    scheduleSync();
  }
  function saveSettings() { store.set("dh.settings", settings); }

  function newConv() {
    const c = { id: uid(), title: t("newTitle"), created: Date.now(), updated: Date.now(), messages: [], llm: [], ctx: {} };
    convs.unshift(c);
    currentId = c.id;
    return c;
  }

  /* =================================================================
     2. 회귀 분석 엔진 (최소제곱법)
     ================================================================= */
  // 가우스 소거법으로 A·c = b 풀기
  function solve(A, b) {
    const n = b.length;
    const M = A.map((row, i) => row.concat([b[i]]));
    for (let col = 0; col < n; col++) {
      let piv = col;
      for (let r = col + 1; r < n; r++) if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
      if (Math.abs(M[piv][col]) < 1e-12) return null;
      [M[col], M[piv]] = [M[piv], M[col]];
      for (let r = col + 1; r < n; r++) {
        const f = M[r][col] / M[col][col];
        for (let c = col; c <= n; c++) M[r][c] -= f * M[col][c];
      }
    }
    const x = new Array(n).fill(0);
    for (let r = n - 1; r >= 0; r--) {
      let s = M[r][n];
      for (let c = r + 1; c < n; c++) s -= M[r][c] * x[c];
      x[r] = s / M[r][r];

  /* =================================================================
     6. 글자 꾸미기 (간단한 마크다운)
     ================================================================= */
  function inline(s) {
    const codes = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
    s = esc(s);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, tx, u) => `<a href="${u}" target="_blank" rel="noopener">${tx}</a>`);
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (_, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
  }
  function md(src) {
    const lines = String(src || "").replace(/\r/g, "").split("\n");
    let html = "", i = 0;
    while (i < lines.length) {
      const l = lines[i];
      if (/^\s*```/.test(l)) {
        const buf = []; i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
        i++; html += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; continue;
      }
      if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
        const head = cells(l); i += 2;
        let body = "";
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { body += `<tr>${cells(lines[i]).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`; i++; }
        html += `<table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`; continue;
      }
      const h = l.match(/^(#{1,4})\s+(.*)/);
      if (h) { const tag = h[1].length > 2 ? "h4" : "h3"; html += `<${tag}>${inline(h[2])}</${tag}>`; i++; continue; }
      if (/^\s*[-*•]\s+/.test(l)) {
        let items = "";
        while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) items += `<li>${inline(lines[i++].replace(/^\s*[-*•]\s+/, ""))}</li>`;
        html += `<ul>${items}</ul>`; continue;
      }
      if (/^\s*\d+[.)]\s+/.test(l)) {
        let items = "";
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) items += `<li>${inline(lines[i++].replace(/^\s*\d+[.)]\s+/, ""))}</li>`;
        html += `<ol>${items}</ol>`; continue;
      }
      if (/^>\s?/.test(l)) {
        const buf = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(inline(lines[i++].replace(/^>\s?/, "")));
        html += `<blockquote>${buf.join("<br>")}</blockquote>`; continue;
      }
      if (!l.trim()) { i++; continue; }
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^\s*(```|[-*•]\s|\d+[.)]\s|#{1,4}\s|>|\|)/.test(lines[i])) buf.push(inline(lines[i++]));
      if (!buf.length) buf.push(inline(lines[i++]));
      html += `<p>${buf.join("<br>")}</p>`;
    }
    return html;
  }

  /* =================================================================
     7. 중계 서버(Worker) 연결
     ================================================================= */
  async function api(path, body) {
    const base = workerUrl();
    if (!base) throw new Error(t("noWorkerUrl"));
    let r;
    try {
      r = await fetch(base + path, {
        method: body ? "POST" : "GET",
        headers: { "content-type": "application/json", "x-access-code": settings.code || "", "x-lang": settings.lang },
        body: body ? JSON.stringify(body) : undefined
      });
    } catch (e) { throw new Error(t("cantConnect")); }
    const j = await r.json().catch(() => ({ error: t("badResp", r.status) }));
    if (!r.ok || j.error) { const e = new Error(j.error || `HTTP ${r.status}`); e.status = r.status; throw e; }
    return j;
  }
  async function checkHealth() {
    if (!workerUrl()) { health = null; renderStatus(); return; }
    try { health = await api("/health"); } catch (e) { health = { error: e.message }; }
    renderStatus();
  }
  const can = what => !!(health && !health.error && health.authorized && health[what]);
  const useAI = () => settings.mode !== "rule" && can("openai");

  /* =================================================================
     8. 첨부 파일 읽기 (PDF · Word · 엑셀 · CSV · 텍스트 · 이미지)
        모든 파일은 브라우저 안에서 읽고, 서버에 따로 올리지 않습니다.
     ================================================================= */
  const libCache = {};
  function loadScript(url, globalName) {
    if (window[globalName]) return Promise.resolve(window[globalName]);
    if (!libCache[url]) libCache[url] = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = url; s.async = true;
      s.onload = () => (window[globalName] ? res(window[globalName]) : rej(new Error(t("libFail"))));
      s.onerror = () => { delete libCache[url]; rej(new Error(t("libFail"))); };
      document.head.appendChild(s);
    });
    return libCache[url];
  }
  function kindOf(file) {
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    if (ext === "pdf" || file.type === "application/pdf") return "pdf";
    if (ext === "docx") return "docx";
    if (ext === "xlsx" || ext === "xls") return "xlsx";
    if (ext === "csv" || ext === "tsv") return "csv";
    if (/^(png|jpe?g|webp|gif)$/.test(ext) || /^image\//.test(file.type)) return "image";
    if (/^(txt|md|json|html?|js|py|xml|log)$/.test(ext) || /^text\//.test(file.type)) return "text";
    return null;
  }
  const KIND_ICON = { pdf: "📕", docx: "📘", xlsx: "📗", csv: "📊", text: "📄", image: "🖼️" };

  function canvasToJpeg(cv) { return cv.toDataURL("image/jpeg", 0.85); }
  function imageToDataUrl(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = () => {
        const s = Math.min(1, 1280 / Math.max(im.width, im.height));
        const cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(im.width * s)); cv.height = Math.max(1, Math.round(im.height * s));
        const g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(im, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url); res(canvasToJpeg(cv));
      };
      im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };
      im.src = url;
    });
  }
  async function readPdf(buf) {
    const lib = await loadScript(LIBS.pdf, "pdfjsLib");
    lib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
    const doc = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
    const pages = doc.numPages, out = [];
    let total = 0;
    for (let p = 1; p <= Math.min(pages, 300) && total < KEEP_TEXT * 1.2; p++) {
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      let s = "";
      tc.items.forEach(it => { s += it.str || ""; s += it.hasEOL ? "\n" : " "; });
      s = s.replace(/[ \t]+/g, " ").replace(/ *\n */g, "\n").trim();
      total += s.length;
      out.push(`[p.${p}]\n${s}`);
    }
    const text = out.join("\n\n");
    const result = { text, pages };
    // 글자가 거의 없으면 스캔한 PDF로 보고 앞쪽 3쪽을 그림으로 만들어 둡니다 (AI 모드에서 사용)
    if (text.replace(/\[p\.\d+\]/g, "").trim().length < 20) {
      result.scanned = true; result.images = [];
      for (let p = 1; p <= Math.min(pages, 3); p++) {
        const page = await doc.getPage(p);
        const v0 = page.getViewport({ scale: 1 });
        const vp = page.getViewport({ scale: Math.min(2, 1280 / Math.max(v0.width, v0.height)) });
        const cv = document.createElement("canvas"); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
        const g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
        await page.render({ canvasContext: g, viewport: vp }).promise;
        result.images.push(canvasToJpeg(cv));
      }
    }
    return result;
  }
  async function readFileData(file) {
    const kind = kindOf(file);
    if (!kind) throw new Error(t("fileUnsupported", file.name));
    if (file.size > MAX_FILE) throw new Error(t("fileTooBig", file.name));
    const f = { id: uid(), name: file.name, kind, size: file.size, text: "" };
    if (kind === "image") { f.dataUrl = await imageToDataUrl(file); return f; }
    if (kind === "pdf") Object.assign(f, await readPdf(await file.arrayBuffer()));
    else if (kind === "docx") { const mm = await loadScript(LIBS.mammoth, "mammoth"); f.text = (await mm.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value || ""; }
    else if (kind === "xlsx") {
      const X = await loadScript(LIBS.xlsx, "XLSX");
      const wb = X.read(new Uint8Array(await file.arrayBuffer()), { type: "array" });
      f.sheets = wb.SheetNames.length;
      const csvs = wb.SheetNames.map(n => ({ n, csv: X.utils.sheet_to_csv(wb.Sheets[n], { blankrows: false }) }));
      f.text = csvs.map(s => (wb.SheetNames.length > 1 ? `[sheet: ${s.n}]\n` : "") + s.csv).join("\n\n");
      f.table = csvs[0] ? csvs[0].csv : "";
    } else f.text = await file.text();
    f.text = f.text.replace(/\u0000/g, "");
    f.length = f.text.length;
    f.truncated = f.text.length > KEEP_TEXT;
    f.text = f.text.slice(0, KEEP_TEXT);
    // 숫자 표라면 첫 두 숫자 열을 회귀 데이터로 준비
    const tableText = kind === "xlsx" ? f.table : (kind === "csv" || /\.(txt|tsv)$/i.test(f.name)) ? f.text : "";
    delete f.table;
    if (tableText) {
      const cols = parseCsv(tableText);
      const names = cols ? Object.keys(cols) : [];
      if (names.length >= 2) f.dataset = { cols: names.slice(0, 2), x: cols[names[0]], y: cols[names[1]], all: names };
    }
    return f;
  }
  const fileMeta = f => [t("kinds")[f.kind], f.pages ? t("pagesN", f.pages) : "", f.scanned ? t("scanned") : (f.kind !== "image" && f.length != null ? t("chars", f.length.toLocaleString(loc())) : ""), fsize(f.size)].filter(Boolean).join(" · ");

  function addFiles(list) {
    for (const file of list) {
      if (pending.length >= MAX_FILES) { flashPending(t("filesLimit")); break; }
      const p = { id: uid(), file, status: "loading", data: null, err: "" };
      pending.push(p);
      readFileData(file).then(d => { p.status = "ok"; p.data = d; }).catch(e => { p.status = "err"; p.err = e.message === "image" ? t("fileFailed", "") : e.message; }).finally(() => { renderPending(); updateSend(); });
    }
    renderPending(); updateSend();
  }
  function flashPending(msg) {
    const box = $("#pending");
    const n = document.createElement("span"); n.className = "note err"; n.textContent = msg; box.appendChild(n);
    setTimeout(() => n.remove(), 3000);
  }
  function renderPending() {
    const box = $("#pending");
    box.innerHTML = "";
    pending.forEach(p => {
      const kind = kindOf(p.file) || "text";
      const el = document.createElement("div");
      el.className = "fchip" + (p.status === "err" ? " err" : "");
      const meta = p.status === "loading" ? `<span class="spinner"></span> ${esc(t("fileReading"))}` : p.status === "err" ? esc(p.err) : esc(fileMeta(p.data));
      el.innerHTML = `<span class="fi">${KIND_ICON[kind]}</span><span class="fn"><b></b><span>${meta}</span></span><button type="button" aria-label="${esc(t("fileRemove"))}" title="${esc(t("fileRemove"))}"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
      $("b", el).textContent = p.file.name;
      el.querySelector("button").addEventListener("click", () => { pending = pending.filter(x => x !== p); renderPending(); updateSend(); });
      box.appendChild(el);
    });
  }
  function fileChipsEl(files) {
    const box = document.createElement("div");
    box.className = "fchips";
    files.forEach(f => {
      const el = document.createElement("div");
      el.className = "fchip";
      el.innerHTML = `<span class="fi">${KIND_ICON[f.kind] || "📄"}</span><span class="fn"><b></b><span></span></span>`;
      $("b", el).textContent = f.name; $(".fn span", el).textContent = fileMeta(f);
      box.appendChild(el);
    });
    return box;
  }
  // AI에게 보낼 사용자 메시지 (파일 내용 포함)
  function userContent(text, files) {
    if (!files.length) return text;
    let s = text;
    const imgs = [];
    files.forEach(f => {
      const head = `[Attached file: ${f.name} · ${f.kind}${f.pages ? " · " + f.pages + " pages" : ""}${f.kind !== "image" ? " · " + (f.length || 0) + " chars" : ""}]`;
      if (f.kind === "image") { s += `\n\n${head}`; if (f.dataUrl) imgs.push(f.dataUrl); return; }
      if (f.scanned || !f.text.trim()) { s += `\n\n${head}\n(No extractable text.${f.images && f.images.length ? " The first pages are attached as images." : ""})`; (f.images || []).forEach(u => imgs.push(u)); return; }
      const more = f.text.length > SEND_TEXT || f.truncated;
      s += `\n\n${head}${more ? `\n(Only the first ${SEND_TEXT} characters are shown. Use search_attached_files or read_attached_file for the rest.)` : ""}${f.dataset ? `\n(Numeric columns ${f.dataset.cols.join(", ")} are loaded as regression data.)` : ""}\n"""\n${f.text.slice(0, SEND_TEXT)}\n"""`;
    });
    if (!imgs.length) return s;

  }
  // 대화에 첨부 파일 보관 (그림 데이터는 빼고)
  function keepFiles(c, files) {
    c.ctx.files = c.ctx.files || [];
    files.forEach(f => {
      const slim = { name: f.name, kind: f.kind, size: f.size, pages: f.pages, length: f.length, scanned: f.scanned, truncated: f.truncated, text: f.text || "" };
      c.ctx.files = c.ctx.files.filter(x => x.name !== f.name);
      c.ctx.files.push(slim);
      if (f.dataset) c.ctx.dataset = { x: f.dataset.x, y: f.dataset.y };
    });
    c.ctx.files = c.ctx.files.slice(-MAX_FILES);
  }

  /* ---------- 8-2. 파일 분석 · 질문 답변 엔진 (인터넷 없이 브라우저 안에서 동작) ----------
     1) 파일 글을 700자 정도의 조각으로 나눕니다. (PDF는 쪽 번호를 함께 기억)
     2) 질문과 각 조각에서 단어를 뽑습니다. (한국어는 조사를 떼고, 두 글자씩 묶은 조각도 사용)
     3) BM25 점수로 질문과 가장 관련 있는 조각을 찾습니다.
     4) 그 조각에서 질문 단어가 가장 많이 들어 있는 문장을 답으로 보여 줍니다. */
  const STOP = new Set(("the a an of to in on for and or is are was were be been being it its this that these those with as by at from what which who whom how why when where do does did can could would should will about into than then there their them they i me my you your we our he she his her not no yes please tell show give explain find file document pdf page pages say says said also more most some any each all use used using one two summarize summary " +
    "이 그 저 것 수 등 및 더 또 또는 그리고 하는 있는 있다 없다 한다 했다 된다 되는 대해 대한 관련 무엇 뭐 뭐야 뭔가 뭔지 어떻게 어떤 왜 언제 어디 누가 알려 알려줘 설명 설명해 해줘 줘 주세요 파일 문서 자료 내용 이것 여기 거기 좀 정도 무슨 나와 나와있어 있어 있나 요약 요약해 정리해 누구 언제 어디 얼마 몇 왜 인가요 입니까 검색 검색해 인터넷 찾아").split(/\s+/));
  const KO_JOSA = /(에서는|에서도|에서|으로는|으로|에게|까지|부터|이라는|라는|이란|이라고|라고|입니다|이에요|예요|이다|하는|했다|하고|하며|한다|된다|에는|와는|과는|에도|은|는|이|가|을|를|의|에|와|과|도|로|만|란|야)$/;
  // 조사 떼기. '이·가·야'는 '베르누이'처럼 단어의 일부일 수 있어서 짧은 단어에서만 뗍니다
  function stripJosa(w) {
    const m = w.match(KO_JOSA);
    if (!m) return w;
    if (/^(이|가|야)$/.test(m[1]) && w.length >= 4) return w;
    return w.slice(0, -m[1].length) || w;
  }
  function words(s) {
    const out = [];
    (String(s).toLowerCase().match(/[a-z][a-z'-]*|\d+(?:\.\d+)?|[가-힣]+/g) || []).forEach(w => {
      if (/^[가-힣]+$/.test(w)) { const b = w.length > 2 ? stripJosa(w) : w; if (b.length >= 2 && !STOP.has(b) && !STOP.has(w)) out.push(b); }
      else if (/^\d/.test(w)) out.push(w);
      else if (w.length > 1 && !STOP.has(w)) out.push(w);
    });
    return out;
  }
  const stem = w => (/^[a-z]/.test(w) && w.length > 4 ? w.replace(/(ies|ing|ed|es|s)$/, "").replace(/e$/, "") : w);
  function tokens(s, bigrams = true) {
    const out = [];
    words(s).forEach(w => {
      out.push(stem(w));
      if (bigrams && /^[가-힣]+$/.test(w)) { if (w.length === 2) out.push("§" + w); else for (let i = 0; i < w.length - 1; i++) out.push("§" + w.slice(i, i + 2)); }
    });
    return out;
  }
  const chunkCache = new WeakMap();
  function chunksOf(f) {
    if (chunkCache.has(f)) return chunkCache.get(f);
    const out = [], isTable = f.kind === "csv" || f.kind === "xlsx";
    let page = null, buf = [], len = 0, header = "";
    const flush = () => {
      const text = buf.join("\n").trim();
      if (text) out.push({ file: f.name, page, text: isTable && header && buf[0] !== header ? header + "\n" + text : text });
      buf = []; len = 0;
    };
    String(f.text || "").split("\n").forEach(l => {
      const pm = l.match(/^\[p\.(\d+)\]$/); if (pm) { flush(); page = +pm[1]; return; }
      const sm = l.match(/^\[sheet: (.+)\]$/); if (sm) { flush(); page = sm[1]; header = ""; return; }
      if (isTable && !header && l.trim()) header = l;
      (l.length > 700 ? l.split(/(?<=[.!?。])\s+/) : [l]).forEach(part => {
        if (len + part.length > 700 && len > 0) flush();
        buf.push(part); len += part.length + 1;

    });

    out.forEach(c => { c.toks = tokens(c.text); });

  }
  function searchFiles(files, query, k = 4) {
    const q = [...new Set(tokens(query))];
    const chunks = files.flatMap(chunksOf);
    if (!q.length || !chunks.length) return [];
    const N = chunks.length, avg = chunks.reduce((s, c) => s + c.toks.length, 0) / N || 1;
    const df = {};
    q.forEach(w => { df[w] = chunks.filter(c => c.toks.includes(w)).length; });
    return chunks.map(c => {
      const tf = {};
      c.toks.forEach(w => { if (w in df) tf[w] = (tf[w] || 0) + 1; });
      let sc = 0;
      q.forEach(w => {
        if (!tf[w]) return;
        const idf = Math.log(1 + (N - df[w] + 0.5) / (df[w] + 0.5));
        sc += (w[0] === "§" ? 0.4 : 1) * idf * tf[w] * 2.2 / (tf[w] + 1.2 * (0.25 + 0.75 * c.toks.length / avg));
      });
      return { file: c.file, page: c.page, text: c.text, score: sc };
    }).filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, k);
  }
  const srcLabel = h => h.file + (h.page != null ? " · " + (typeof h.page === "number" ? t("srcPage", h.page) : h.page) : "");
  // 문장 나누기: 줄바꿈 하나는 문장이 이어지는 것으로 보고, 빈 줄이나 마침표에서 나눕니다 (PDF는 문장 중간에 줄이 바뀌기 때문)
  const sentencesOf = text => String(text).replace(/\[p\.\d+\]|\[sheet: [^\]]+\]/g, "\n\n").replace(/([^\n])\n(?!\n)/g, "$1 ").split(/(?<=[.!?。])\s+|\n{2,}/).map(x => x.replace(/\s+/g, " ").trim()).filter(x => x.length >= 8);
  // 질문 단어가 가장 많이 들어 있는 문장을 찾고, 이유를 묻는 질문이면 "때문에" 같은 말이 있는 바로 다음 문장도 함께 보여 줍니다
  function bestSentence(text, query) {
    const q = new Set(tokens(query));
    const why = /왜|이유|까닭|\bwhy\b|\breason/i.test(query);
    const REASON = /때문|이유|덕분|그래서|따라서|because|since|due\s+to|reason|therefore|so\s+that/i;
    const sents = sentencesOf(text);
    const sc = sents.map(x => { const tk = new Set(tokens(x)); let n = 0; q.forEach(w => { if (tk.has(w)) n += w[0] === "§" ? 0.4 : 1; }); return n; });
    let bi = -1, bs = 0;
    sents.forEach((x, i) => {
      if (!sc[i]) return;
      const next = sents[i + 1] || "";
      const v = sc[i] + 0.3 * (sc[i + 1] || 0) + (why && (REASON.test(x) || REASON.test(next)) ? 0.8 : 0) + Math.min(x.length, 200) / 2000;
      if (v > bs) { bs = v; bi = i; }
    });
    if (bi < 0) return null;
    const next = sents[bi + 1];
    const addNext = next && next !== sents[bi] && (sc[bi + 1] > 0 || (why && REASON.test(next)) || sents[bi].length < 25) && sents[bi].length + next.length < 380;
    return addNext ? sents[bi] + " " + next : sents[bi];
  }
  function analyzeText(f) {
    const sents = sentencesOf(f.text).slice(0, 800);
    const freq = {};
    words(f.text).forEach(w => { if (!/^\d/.test(w)) freq[w] = (freq[w] || 0) + 1; });
    const keywords = Object.entries(freq).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([w]) => w);
    const top = sents.map((x, i) => {
      const tk = words(x);
      const sc = tk.length ? tk.reduce((a, w) => a + (freq[w] || 0), 0) / Math.sqrt(tk.length) : 0;
      return { x, i, sc: sc * (x.length > 300 ? 0.5 : 1) * (i < 3 ? 1.2 : 1) };
    }).sort((a, b) => b.sc - a.sc).slice(0, 4).sort((a, b) => a.i - b.i).map(o => (o.x.length > 260 ? o.x.slice(0, 260) + "…" : o.x));
    return { keywords, summary: top, count: sents.length };
  }
  function tableStats(f) {
    if (!(f.kind === "csv" || f.kind === "xlsx" || /\.(txt|tsv)$/i.test(f.name))) return null;
    const first = String(f.text).split(/\n\s*\n\[sheet:/)[0].replace(/^\[sheet: [^\]]+\]\n/, "");
    const cols = parseCsv(first);
    if (!cols) return null;
    const names = Object.keys(cols);
    const st = names.map(name => {
      const v = cols[name], n = v.length, sum = v.reduce((a, b) => a + b, 0), mean = sum / n;
      const sd = Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / Math.max(1, n - 1));
      return { name, n, mean: round(mean, 6), sd: round(sd, 6), min: Math.min(...v), max: Math.max(...v), sum: round(sum, 6) };
    });
    let corr = null;
    if (names.length >= 2) {
      const x = cols[names[0]], y = cols[names[1]], mx = st[0].mean, my = st[1].mean;
      let sxy = 0, sxx = 0, syy = 0;
      x.forEach((xi, i) => { sxy += (xi - mx) * (y[i] - my); sxx += (xi - mx) ** 2; syy += (y[i] - my) ** 2; });
      if (sxx > 0 && syy > 0) corr = { a: names[0], b: names[1], r: round(sxy / Math.sqrt(sxx * syy), 4) };
    }
    return { cols: st, corr, rows: st[0].n };
  }
  function fileCardSpec(f) {
    const st = tableStats(f), a = st ? null : analyzeText(f);
    return { type: "fstat", name: f.name, kind: f.kind, pages: f.pages, length: f.length != null ? f.length : f.text.length, sentences: a ? a.count : 0, keywords: a ? a.keywords : [], summary: a ? a.summary : [], table: st };
  }
  function findFile(files, name) {
    const n = String(name || "").trim().toLowerCase();
    if (!n) return null;
    return files.find(x => x.name.toLowerCase() === n) || files.find(x => x.name.toLowerCase().includes(n) || n.includes(x.name.toLowerCase().replace(/\.[^.]+$/, "")));
  }
  // 답에서 질문 단어를 굵게 표시 (마크다운 기호는 미리 지움)
  const plainMd = x => String(x).replace(/[`*|]/g, "").replace(/^[#>\-\s]+/, "").replace(/\s+/g, " ").trim();
  function highlight(x, query) {
    const ws = [...new Set(words(query))].filter(w => w.length >= 2).sort((a, b) => b.length - a.length).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    x = plainMd(x);
    return ws.length ? x.replace(new RegExp(`(${ws.join("|")})`, "gi"), "**$1**").replace(/\*\*\*\*/g, "") : x;

  function snippet(text, query, max = 220) {

  }

  /* ---------- 8-3. 인터넷 검색 ----------
     - 중계 서버에 OpenAI가 연결되어 있으면: OpenAI 웹 검색으로 인터넷 전체를 찾아 출처와 함께 요약
     - 아니면: 위키백과 API를 브라우저에서 바로 사용 (키가 필요 없음) */
  const canWeb = () => settings.web !== false;
  const safeUrl = u => String(u || "").replace(/\(/g, "%28").replace(/\)/g, "%29").replace(/\s/g, "%20");
  const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };
  const stripTags = h => String(h || "").replace(/<[^>]+>/g, "").replace(/&quot;/g, '"').replace(/&#0?39;/g, "'").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
  // 10초 안에 답이 없으면 멈추고, 접속 오류는 알아보기 쉬운 말로 바꿉니다.
  // (미리보기 화면처럼 fetch를 대신 전달하는 곳에서는 AbortSignal을 넘길 수 없어서, 시간 제한은 따로 겁니다)
  async function fetchJson(url, ms = 10000) {
    let timer = null;
    const timeout = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error(t("webTimeout"))), ms); });
    try {
      const r = await Promise.race([fetch(url), timeout]);
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await Promise.race([r.json(), timeout]);
    } catch (e) {
      if (/failed to fetch|networkerror|load failed|network request failed/i.test(e.message)) throw new Error(t("webBlocked"));
      throw e;
    } finally { clearTimeout(timer); }
  }
  // ① 위키백과를 브라우저에서 바로 검색
  async function wikiDirect(query) {
    const tryLang = async lang => {
      const base = `https://${lang}.wikipedia.org`;
      const j = await fetchJson(`${base}/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=5&format=json&origin=*`);
      const hits = (j.query || {}).search || [];
      if (!hits.length) return null;
      const sources = hits.map(h => ({ title: h.title, url: safeUrl(`${base}/wiki/${encodeURIComponent(h.title.replace(/ /g, "_"))}`), snippet: stripTags(h.snippet) + "…" }));
      let answer = "";
      try { answer = (await fetchJson(`${base}/api/rest_v1/page/summary/${encodeURIComponent(hits[0].title.replace(/ /g, "_"))}`, 8000)).extract || ""; }
      catch (e) { /* 요약을 못 가져와도 목록은 보여 줌 */ }
      return { provider: "wikipedia", lang, answer: answer || sources[0].snippet, sources };
    };
    const first = settings.lang === "en" ? "en" : "ko";
    return (await tryLang(first)) || (await tryLang(first === "ko" ? "en" : "ko")) || { provider: "wikipedia", answer: "", sources: [] };
  }
  // ② 브라우저에서 막히면 중계 서버를 거쳐 위키백과 검색
  async function wikiViaWorker(query) {
    const r = await api("/wiki", { query, lang: settings.lang });
    return Object.assign({ provider: "wikipedia" }, r, { sources: r.sources || [] });
  }
  // 검색 순서: OpenAI 웹 검색 → 위키백과(브라우저) → 위키백과(중계 서버)
  async function webSearch(query) {
    query = String(query || "").trim();
    if (!query) throw new Error(t("webNoQuery"));
    if (settings.web === false) throw new Error(t("webOff"));
    const errors = [];
    if (can("search")) {
      try {
        const r = await api("/search", { query, lang: settings.lang });
        if (r.answer || (r.sources && r.sources.length)) return Object.assign({ provider: "openai" }, r, { sources: r.sources || [] });
      } catch (e) { errors.push(`${t("provOpenAI")}: ${e.message}`); }
    }
    if (can("web")) {
      try {
        const r = await api("/web", { query, lang: settings.lang });
        if ((r.results || []).length) return Object.assign({}, r, { provider: r.provider || "DuckDuckGo", sources: r.results, pages: r.pages || [] });
      } catch (e) { errors.push(`${t("provWeb", (health && health.webProvider) || "Web")}: ${e.message}`); }
    }
    // 위키백과에는 질문 문장보다 핵심 단어가 잘 맞습니다 (조사·질문 말 빼기)
    const core = words(query).filter(w => !/^\d+$/.test(w)).join(" ") || query;
    try { return await wikiDirect(core); } catch (e) { errors.push(`${t("provWiki")}: ${e.message}`); }
    if (can("wiki")) {
      try { return await wikiViaWorker(core); } catch (e) { errors.push(`${t("provWikiRelay")}: ${e.message}`); }
    }
    throw new Error(t("webAllFail", errors, navigator.onLine === false, !!workerUrl()));
  }
  const isWebProv = p => p && p !== "openai" && p !== "wikipedia";
  const provName = p => (p === "openai" ? t("provOpenAI") : p === "wikipedia" ? t("provWiki") : t("provWeb", p));
  // 검색 결과 페이지들에서 질문과 가장 관련 있는 부분 찾기 (파일 질문과 같은 방법)
  function webExtract(r, q) {
    const titles = {}, pages = [], snips = [];
    (r.pages || []).forEach(pg => { if (pg.text) { titles[pg.url] = pg.title || hostOf(pg.url); pages.push({ name: pg.url, kind: "text", text: pg.text }); } });
    (r.sources || []).forEach(x => { titles[x.url] = titles[x.url] || x.title; if (x.snippet) snips.push({ name: x.url, kind: "text", text: x.snippet }); });
    // 페이지 본문에서 먼저 찾고, 없으면 검색 결과 요약에서 찾습니다
    const hits = searchFiles(pages, q, 4);

  }
  // 기본 모드에서 검색어만 남기기
  function searchQuery(tx) {
    const q = tx.replace(/인터넷(에서|으로)?|웹(에서|으로)?|구글(에서|로)?|네이버(에서)?|온라인(에서|으로)?|검색\s*(해\s*(줘|주세요|봐)?|좀)?|찾아\s*(줘|봐|주세요)|알려\s*(줘|주세요)|에\s*대해(서)?|에\s*관해(서)?|뭐야|뭔가요|무엇인가요|무엇이야|란\s*뭐|이란|좀|\b(search|look\s*up|google|the\s+web|web|internet|online|for|about|please|tell\s+me|what\s+is|what's|who\s+is|find|on|me)\b|[?？!.]/gi, " ").replace(/\s+/g, " ").trim();

  /* =================================================================
     9. 도구 (회귀 · 신경망 · 기억 · 파일 · GitHub · Notion)

  const S = (type, description, extra = {}) => Object.assign({ type, description }, extra);

  const TOOLS = {

          hidden_layers: S("integer", "Number of hidden layers 0-4 (default 1)"), neurons: S("integer", "Neurons per hidden layer 1-16 (default 4)"),
          activation: S("string", "Hidden-layer activation function", { enum: ["sigmoid", "tanh", "relu"] }),
          learning_rate: S("number", "Learning rate (0.5 for 0/1 problems, 0.1 for numeric problems)"), epochs: S("integer", "Epochs (default 5000, max 20000)"),

      run: (a, cx) => toolTrainNN(a, cx)

  const isNumArr = a => Array.isArray(a) && a.length && a.every(v => typeof v === "number" && isFinite(v));
  const toNums = a => (Array.isArray(a) ? a.map(Number) : []);

  function toolRegression(a, cx) {
    const c = cx.conv;
    let x = toNums(a.x), y = toNums(a.y);
    if (!x.length && !y.length && c.ctx.dataset) ({ x, y } = c.ctx.dataset);
    if (!isNumArr(x) || !isNumArr(y)) return { error: t("tXY") };
    if (x.length !== y.length) return { error: t("tXYCount", x.length, y.length) };
    if (x.length < 2) return { error: t("tNeed2") };
    const degree = Math.max(2, Math.min(6, Math.round(a.degree || 2)));
    const model = REG[a.model] ? a.model : "all";
    const { res, best } = regAll(x, y, degree);
    const sel = model === "all" ? (best || "linear") : model;
    const predict = toNums(a.predict_x).filter(v => isFinite(v));
    c.ctx.dataset = { x, y };
    c.ctx.last = { kind: "reg", model: sel, degree };
    cx.bot.addCard({ type: "reg", x, y, sel, degree, showAll: model === "all", predict });
    const r = res[sel];
    c.ctx.report = regReport(x, y, res, sel, degree, model === "all", predict);
    return {
      points: x.length, selected_model: regName(sel, degree),
      equation: r.eq, r2: round(r.r2), adjusted_r2: round(r.adj), rmse: round(r.rmse), fit_quality: r.error ? null : r2Words(r.r2),
      error: r.error || undefined,
      predictions: !r.error && predict.length ? predict.map(px => ({ x: px, y: round(r.f(px), 6) })) : undefined,
      comparison: model === "all" ? REG_ORDER.map(k => res[k].error ? { model: res[k].name, error: res[k].error } : { model: res[k].name, equation: res[k].eq, r2: round(res[k].r2), adjusted_r2: round(res[k].adj), rmse: round(res[k].rmse) }) : undefined,
      best_by_adjusted_r2: model === "all" && best ? regName(best, degree) : undefined,
      note: t("tShown")
    };
  }
  function regReport(x, y, res, sel, degree, all, predict) {
    const r = res[sel];
    let s = `${t("repReg", regName(sel, degree))}\n\n${t("repData", x.length)}\n- x: ${x.join(", ")}\n- y: ${y.join(", ")}\n`;
    if (r.error) return s + t("repErr", r.error) + "\n";
    s += `- ${t("repEq")}: \`${r.eq}\`\n- R²: ${fmt(r.r2)} (${r2Words(r.r2)})\n- ${t("adjLabel")}: ${fmt(r.adj)}\n- RMSE: ${fmt(r.rmse)}\n`;
    if (predict.length) s += `\n### ${t("repPred")}\n\n| x | ${t("repPredCol")} |\n|---|---|\n${predict.map(px => `| ${px} | ${fmt(r.f(px), 6)} |`).join("\n")}\n`;
    if (all) s += `\n### ${t("repCompare")}\n\n| ${t("thModel")} | ${t("thEq")} | R² | ${t("adjLabel")} | RMSE |\n|---|---|---|---|---|\n${REG_ORDER.map(k => res[k].error ? `| ${res[k].name} | ${res[k].error} | | | |` : `| ${res[k].name} | ${res[k].eq} | ${fmt(res[k].r2)} | ${fmt(res[k].adj)} | ${fmt(res[k].rmse)} |`).join("\n")}\n`;
    return s;
  }

  function toolTrainNN(a, cx) {
    const c = cx.conv;
    let inputs = a.inputs, outputs = a.outputs, preset = null, label = "";
    if (a.preset && NN_PRESETS[a.preset] && !(Array.isArray(inputs) && inputs.length)) { preset = a.preset; ({ inputs, outputs } = NN_PRESETS[a.preset]); }
    if (!Array.isArray(inputs) || !inputs.length) {
      if (c.ctx.nnData) ({ inputs, outputs, preset = null, label = "" } = c.ctx.nnData);
      else return { error: t("tNNData") };
    }
    if (Array.isArray(outputs) && outputs.length && !Array.isArray(outputs[0])) outputs = outputs.map(v => [v]);
    if (Array.isArray(inputs) && inputs.length && !Array.isArray(inputs[0])) inputs = inputs.map(v => [v]);
    inputs = inputs.map(r => r.map(Number)); outputs = (outputs || []).map(r => r.map(Number));
    let m;
    try { m = nnTrain({ inputs, outputs, hidden_layers: a.hidden_layers, neurons: a.neurons, activation: a.activation, learning_rate: a.learning_rate, epochs: a.epochs }); }
    catch (e) { return { error: e.message }; }
    const slim = nnSlim(m);
    const predict = Array.isArray(a.predict_inputs) ? a.predict_inputs.filter(r => Array.isArray(r) && r.length === inputs[0].length).map(r => r.map(Number)) : [];
    const meta = { preset, label };
    c.ctx.nn = slim; c.ctx.nnData = { inputs, outputs, preset, label }; c.ctx.last = { kind: "nn" };
    cx.bot.addCard({ type: "nn", model: slim, inputs, outputs, preset, label, predict });
    const ev = nnEvaluate(slim, inputs, outputs);
    c.ctx.report = nnReport(slim, inputs, outputs, dataLabel(meta), ev, predict);
    return {
      data: dataLabel(meta) || t("ownData", inputs.length), preset: preset || undefined, architecture: archText(slim), hidden_layers: slim.sizes.length - 2,
      activation: ACT[slim.act].name(), learning_rate: slim.lr,
      epochs: slim.epochs, final_loss: round(slim.finalLoss, 6), correct: ev.correct, total: ev.total, diverged: slim.diverged,
      results: ev.rows.slice(0, 20).map(r => ({ input: r.x, target: r.t, prediction: r.p.map(v => round(v, 4)) })),
      predictions: predict.length ? predict.map(x => ({ input: x, prediction: nnPredict(slim, x).map(v => round(v, 4)) })) : undefined,
      note: t("tShown")
    };
  }
  function nnReport(m, inputs, outputs, label, ev, predict) {
    let s = `${t("repNN", label)}\n\n- ${t("repArch")}: ${archText(m)}\n- ${t("repAct")}: ${ACT[m.act].name()}, ${t("repLr")}: ${m.lr}\n${t("repEp", m.epochs, fmt(m.finalLoss))}\n${t("repCorrect", ev.correct, ev.total)}\n\n${t("repTh")}\n|---|---|---|---|\n`;
    s += ev.rows.map(r => `| ${r.x.join(", ")} | ${r.t.join(", ")} | ${r.p.map(v => fmt(v)).join(", ")} | ${r.ok ? t("repOk") : t("repNg")} |`).join("\n") + "\n";
    if (predict.length) s += `\n### ${t("repNewIn")}\n\n${predict.map(x => `- ${x.join(", ")} → ${nnPredict(m, x).map(v => fmt(v, 5)).join(", ")}`).join("\n")}\n`;
    return s;
  }
  function toolPredictNN(a, cx) {
    const c = cx.conv;
    if (!c.ctx.nn) return { error: t("tNoNN") };
    const nIn = c.ctx.nn.sizes[0];
    const inputs = (a.inputs || []).map(r => (Array.isArray(r) ? r : [r]).map(Number)).filter(r => r.length === nIn && r.every(isFinite));
    if (!inputs.length) return { error: t("tGroup", nIn) };
    const d = c.ctx.nnData;
    cx.bot.addCard({ type: "nn", model: c.ctx.nn, inputs: d.inputs, outputs: d.outputs, preset: d.preset, label: d.label, predict: inputs });
    return { predictions: inputs.map(x => ({ input: x, prediction: nnPredict(c.ctx.nn, x).map(v => round(v, 5)), binary_output: c.ctx.nn.binaryOut })) };
  }

  function toolSearchPast(q, cx) {
    const others = convs.filter(c => c.id !== cx.conv.id && c.messages.length);
    const words = q.toLowerCase().split(/\s+/).filter(w => w.length > 1);

    return {

  function parseCsv(text) {
    const rows = String(text).trim().split(/\r?\n/).map(l => l.split(/[,\t;]/).map(s => s.trim().replace(/^"|"$/g, ""))).filter(r => r.some(Boolean));
    if (rows.length < 2) return null;
    const isNum = v => v !== "" && isFinite(Number(v));
    const header = rows[0].some(v => v !== "" && !isNum(v)) ? rows.shift() : rows[0].map((_, i) => t("col", i + 1));
    const cols = {};
    header.forEach((h, i) => { const vals = rows.map(r => r[i]); if (vals.length >= 2 && vals.every(isNum)) cols[h || t("col", i + 1)] = vals.map(Number); });
    return Object.keys(cols).length ? cols : null;
  }
  async function toolGithubRead(path, cx) {
    const r = await api("/github/read", { path });
    const out = { path: r.path, size: r.size, truncated: r.truncated, content: r.content.slice(0, 20000) };
    if (/\.(csv|tsv|txt)$/i.test(r.path)) {
      const cols = parseCsv(r.content);
      if (cols) {
        out.numeric_columns = Object.fromEntries(Object.entries(cols).map(([k, v]) => [k, v.slice(0, 500)]));
        const names = Object.keys(cols);
        if (names.length >= 2) { cx.conv.ctx.dataset = { x: cols[names[0]], y: cols[names[1]] }; out.note = t("tCsv", names[0], names[1]); }
      }
    }
    return out;
  }

    if (c.ctx.dataset) lines.push(`- Regression data (${c.ctx.dataset.x.length} points): x=[${c.ctx.dataset.x.slice(0, 60).join(", ")}], y=[${c.ctx.dataset.y.slice(0, 60).join(", ")}]`);

    if (c.ctx.files && c.ctx.files.length) lines.push("- Attached files: " + c.ctx.files.map(f => `${f.name} (${f.kind}${f.pages ? ", " + f.pages + " pages" : ""}${f.kind !== "image" ? ", " + f.text.length + " chars readable" : ""})`).join("; "));
    if (!c.ctx.dataset && !c.ctx.nnData && !(c.ctx.files && c.ctx.files.length)) lines.push("- (none yet)");
    if (c.ctx.report) lines.push("\n[Latest result report]\n" + c.ctx.report.slice(0, 3000));
    lines.push(`\n[Connections] Notion: ${can("notion") ? "available" : "not connected"} / GitHub: ${can("github") ? "available (" + health.repo + ")" : "not connected"} / Web search: ${!canWeb() ? "off (do not call web_search)" : can("search") || can("web") ? "available (whole web)" : "available (Wikipedia only)"}`);
    return lines.join("\n");
  }
  // 오래된 기록은 잘라 내되, 항상 사용자 메시지에서 시작하도록
  function trimHistory(h) {
    const MAX = 40;
    if (h.length <= MAX) return h;
    let start = h.length - MAX;
    while (start < h.length && h[start].role !== "user") start++;
    return h.slice(start);
  }
  async function aiTurn(c, text, files, bot) {
    if (!Array.isArray(c.llm)) c.llm = [];
    const before = c.llm.length;
    let content = userContent(text, files);
    // 예전에 올린 파일이 있으면, 질문과 관련 있는 부분을 미리 찾아 함께 보냅니다
    const older = (c.ctx.files || []).filter(f => (f.text || "").trim() && !files.some(n => n.name === f.name));
    if (older.length) {
      const hits = searchFiles(older, text, 3);
      if (hits.length) {
        const extra = "\n\n[Relevant passages from earlier attached files, found automatically]\n" + hits.map(h => `(${srcLabel(h)})\n\"\"\"\n${h.text.slice(0, 1200)}\n\"\"\"`).join("\n");
        content = typeof content === "string" ? content + extra : [{ type: "text", text: content[0].text + extra }, ...content.slice(1)];
      }
    }
    c.llm.push({ role: "user", content });
    const tools = Object.entries(TOOLS).map(([name, tool]) => ({ type: "function", function: Object.assign({ name }, tool.decl) }));
    try {
      for (let round = 0; round < 8; round++) {
        const res = await api("/chat", { messages: [{ role: "system", content: systemPrompt(c) }, ...trimHistory(c.llm)], tools });
        const choice = res.choices && res.choices[0];
        const msg = choice && choice.message;
        if (!msg) throw new Error(t("aiEmpty", (choice && choice.finish_reason) || "empty"));
        const calls = Array.isArray(msg.tool_calls) ? msg.tool_calls : [];
        const saved = { role: "assistant", content: msg.content || null };
        if (calls.length) saved.tool_calls = calls;
        c.llm.push(saved);
        if (msg.content) bot.addText(msg.content);
        else if (msg.refusal) bot.addText(msg.refusal);
        if (!calls.length) {
          if (!msg.content && !msg.refusal) throw new Error(t("aiEmpty", choice.finish_reason || "empty"));
          return;
        }
        for (const tc of calls) {
          let args = {};
          try { args = JSON.parse((tc.function && tc.function.arguments) || "{}"); } catch (e) { args = {}; }
          const out = tc.type === "function" || tc.function ? await runTool(tc.function.name, args, { conv: c, bot }) : { error: "unsupported tool call" };
          c.llm.push({ role: "tool", tool_call_id: tc.id, content: JSON.stringify(out) });
        }
      }
      bot.addText(t("tooManyTools"));
    } catch (e) {
      c.llm.length = before;
      throw e;
    }
  }

  /* =================================================================
     11. 기본 모드: 정해진 표현을 알아듣는 규칙 (한국어와 영어 모두)
     ================================================================= */
  const NUM_RE = /-?\d+(?:\.\d+)?(?:e-?\d+)?/gi;
  const nums = s => (String(s).match(NUM_RE) || []).map(Number);

  function parseXY(tx) {
    const lab = name => tx.match(new RegExp(`(?:^|[^a-z가-힣])${name}\\s*(?:값|좌표|데이터|values?)?\\s*(?:[:=]|은|는|가|이|is|are)?\\s*[\\[(]?\\s*((?:-?\\d+(?:\\.\\d+)?\\s*[,\\s]\\s*)+-?\\d+(?:\\.\\d+)?)`, "i"));
    const mx = lab("x"), my = lab("y");
    if (mx && my) { const x = nums(mx[1]), y = nums(my[1]); if (x.length >= 2 && x.length === y.length) return { x, y }; }
    const pairs = [...tx.matchAll(/\(\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*\)/g)];
    if (pairs.length >= 2) return { x: pairs.map(p => +p[1]), y: pairs.map(p => +p[2]) };
    const rows = tx.split(/\n/).map(nums).filter(a => a.length === 2);
    if (rows.length >= 2) return { x: rows.map(r => r[0]), y: rows.map(r => r[1]) };
    return null;
  }
  function parseNNData(tx) {
    const rows = tx.split(/\n|;|\//).map(l => l.split(/->|→|=>|⇒/)).filter(p => p.length === 2).map(([a, b]) => [nums(a), nums(b)]).filter(([a, b]) => a.length && b.length);
    if (rows.length >= 2 && rows.every(r => r[0].length === rows[0][0].length && r[1].length === rows[0][1].length)) return { inputs: rows.map(r => r[0]), outputs: rows.map(r => r[1]) };
    const mi = tx.match(/(?:입력|inputs?)\s*[:=]?\s*(\[\s*\[[\s\S]*?\]\s*\])/i), mo = tx.match(/(?:출력|정답|outputs?|targets?)\s*[:=]?\s*(\[[\s\S]*?\](?:\s*\])?)/i);
    if (mi && mo) {
      try { const inputs = JSON.parse(mi[1]); let outputs = JSON.parse(mo[1]); if (!Array.isArray(outputs[0])) outputs = outputs.map(v => [v]); return { inputs, outputs }; } catch (e) { /* 형식이 다르면 무시 */ }
    }
    return null;
  }
  function detectModel(tx) {
    if (/비교|가장\s*잘|어떤\s*(모델|선|식)|추천|모든|전부|다\s*해|compare|best|which\s+(model|one|curve)|recommend|all\s+models|every\s+model/i.test(tx)) return "all";
    if (/다항|포물선|\d\s*차|polynomial|quadratic|cubic|parabola|degree/i.test(tx)) return "poly";
    if (/지수|exponential/i.test(tx)) return "exp";
    if (/거듭\s*제곱|멱|power/i.test(tx)) return "power";
    if (/로그|logarithm|\blog\b/i.test(tx)) return "log";
    if (/비선형|non-?\s*linear/i.test(tx)) return "all";
    if (/선형|직선|\blinear\b|straight\s+line/i.test(tx)) return "linear";
    return null;
  }
  function detectDegree(tx) {
    const m = tx.match(/(\d)\s*차/) || tx.match(/degree\s*(?:of\s*)?(\d)/i) || tx.match(/(\d)\s*(?:st|nd|rd|th)?[\s-]*degree/i);
    if (m) return +m[1];
    if (/cubic/i.test(tx)) return 3;
    if (/quadratic/i.test(tx)) return 2;
    return undefined;
  }
  const stripOptions = tx => tx.replace(/\d\s*차|degree\s*(?:of\s*)?\d|\d\s*(?:st|nd|rd|th)?[\s-]*degree/gi, " ");
  const PRESET_TESTS = [
    ["xor", tx => /xor|배타적/i.test(tx)],
    ["and", tx => /\bAND\b/.test(tx) || /논리곱|(^|[^a-z])and\s*(gate|problem|문제|게이트|학습|데이터)/i.test(tx)],
    ["or", tx => /\bOR\b/.test(tx) || /논리합|(^|[^a-z])or\s*(gate|problem|문제|게이트|학습|데이터)/i.test(tx)],
    ["temp", tx => /섭씨|화씨|온도|celsius|fahrenheit|temperature/i.test(tx)],
    ["curve", tx => /곡선|x\s*²|x\^2|제곱\s*함수|\bcurve\b|parabola/i.test(tx)]
  ];
